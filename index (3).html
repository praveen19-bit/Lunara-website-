<style id="lz-site-css">
/* ==========================================================
   LUNARA CREATIONS — public site styles
   Colours, fonts and radius are overridden at runtime from the admin's
   Design settings (see applyTheme in js/site-app.js).
   ========================================================== */
:root{
  --bg:#FAF7F2; --bg-2:#F0E8DE; --text:#27231F; --text-2:#5F5A54;
  --accent:#B99A62; --accent-dark:#7A6137; --dark:#191816; --line:#E8DED2; --white:#fff; --nav:#0B0B0B;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:18px; --shadow:0 10px 30px rgba(39,35,31,.08); --shadow-lg:0 24px 60px rgba(39,35,31,.14);
  --ease:cubic-bezier(.22,.7,.2,1);
  --header-h:96px;
  --photo-filter:none;
}
html.tone{--photo-filter:saturate(.95) sepia(.06)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + 8px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{display:block;max-width:100%;color:transparent;font-size:0}
img.photo{filter:var(--photo-filter)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.1;margin:0;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent-dark);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--dark);color:#fff;padding:10px 16px;border-radius:999px;z-index:400;transition:top .2s}
.skip:focus{top:12px}
.container{width:min(1280px,100% - 40px);margin-inline:auto}
section{position:relative}
.section-pad{padding:clamp(64px,9vw,128px) 0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-dark);display:inline-flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--accent)}
.section-head{max-width:720px;margin-bottom:clamp(32px,5vw,60px)}
.section-head h2{font-size:clamp(2.3rem,5vw,3.9rem);margin:14px 0 16px}
.section-head p{color:var(--text-2);font-size:1.05rem;max-width:560px}
.section-head.center{margin-inline:auto;text-align:center}
.section-head.center p{margin-inline:auto}
.section-head.center .eyebrow::before{display:none}
svg{flex:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 28px;border-radius:999px;font-size:.92rem;font-weight:600;letter-spacing:.02em;transition:transform .35s var(--ease),background .3s,color .3s,box-shadow .3s,border-color .3s;border:1px solid transparent;text-align:center}
.btn svg{width:16px;height:16px;transition:transform .35s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn-dark{background:var(--text);color:var(--bg)}
.btn-dark:hover{background:var(--accent-dark);transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-ghost{border-color:var(--text);color:var(--text)}
.btn-ghost:hover{background:var(--text);color:var(--bg);transform:translateY(-2px)}
.btn-gold{background:var(--accent);color:var(--dark)}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn-light{border-color:rgba(255,255,255,.45);color:#fff}
.btn-light:hover{background:#fff;color:var(--dark)}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.link-arrow svg{width:15px;height:15px;transition:transform .35s var(--ease)}

/* Announcement */
.announce{background:var(--dark);color:#EBE1CF;text-align:center;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;font-weight:600}
.announce .m{color:var(--accent)}

/* Header — black pill navbar */
.site-header{position:sticky;top:0;z-index:100;padding:12px 0 10px;transition:transform .55s var(--ease);will-change:transform}
.site-header.hide{transform:translateY(calc(-100% - 8px))}
.navbar{position:relative;width:min(1280px,100% - 32px);margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--nav);color:#fff;border-radius:999px;padding:7px 7px 7px 8px;box-shadow:0 18px 40px rgba(20,18,30,.22);transform-origin:50% 0;transition:transform .55s var(--ease),box-shadow .45s var(--ease),background-color .45s var(--ease)}
.site-header.scrolled .navbar{transform:translateY(-3px) scale(.965);box-shadow:0 22px 48px rgba(20,18,30,.34);background-color:var(--nav)}
@supports (backdrop-filter:blur(1px)) and (background:color-mix(in srgb,red,blue)){
  .site-header.scrolled .navbar{background-color:color-mix(in srgb,var(--nav) 90%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
}
.scroll-progress{position:fixed;left:0;top:0;right:0;height:3px;z-index:140;background:linear-gradient(90deg,var(--accent),var(--accent-dark));transform:scaleX(0);transform-origin:0 50%;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;flex:none;color:#fff;border-radius:999px;padding-right:6px}
.brand-mark{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;transition:transform .5s var(--ease)}
.brand:hover .brand-mark{transform:rotate(-8deg) scale(1.05)}
.brand-mark svg{width:30px;height:30px}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text b{font-family:var(--serif);font-weight:600;font-size:1.45rem;letter-spacing:.14em;text-transform:uppercase}
.brand-text small{font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);margin-top:4px;font-weight:600}
.nav-panel{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
.nav-links{display:flex;gap:clamp(14px,2.2vw,34px)}
.nav-links a{position:relative;display:inline-block;color:#fff;font-size:.95rem;font-weight:600;padding:8px 2px;transition:color .3s}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;border-radius:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.nav-links a:hover,.nav-links a:focus-visible,.nav-links a[aria-current="true"]{color:var(--accent)}
.nav-links a:hover::after,.nav-links a:focus-visible::after,.nav-links a[aria-current="true"]::after{transform:scaleX(1)}
.nav-links a:focus-visible,.brand:focus-visible,.nav-cta:focus-visible,.nav-toggle:focus-visible,.nav-tools .icon-btn:focus-visible{outline-color:#fff}
.panel-extra{display:none}
.nav-tools{display:flex;align-items:center;gap:2px;margin-left:auto}
.icon-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:background .25s,transform .25s}
.icon-btn svg{width:22px;height:22px}
.nav-tools .icon-btn{color:#fff}
.nav-tools .icon-btn:hover{background:rgba(255,255,255,.14)}
.badge{position:absolute;top:2px;right:0;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--dark);font-size:.72rem;font-weight:700;display:grid;place-items:center;line-height:1;transition:transform .3s}
.badge[hidden]{display:none}
.badge.bump{transform:scale(1.3)}
.nav-cta{flex:none;height:50px;padding:0 24px;border-radius:999px;background:var(--accent);color:var(--dark);font-size:.92rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .3s,transform .3s var(--ease)}
.nav-cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.nav-cta svg{width:16px;height:16px}
.nav-toggle{display:none;flex:none;width:48px;height:48px;border-radius:50%;place-items:center;color:#fff;transition:background .3s}
.nav-toggle:hover{background:rgba(255,255,255,.14)}
.nav-toggle svg{width:26px;height:26px}

/* Hero */
.hero{overflow:hidden;padding:clamp(20px,4vw,52px) 0 clamp(60px,8vw,104px)}
.hero-grid{display:grid;grid-template-columns:1.02fr 1fr;gap:clamp(28px,5vw,80px);align-items:center;min-height:min(calc(100vh - var(--header-h) - 100px),640px)}
.hero-copy{position:relative;z-index:2}
.hero-label{display:inline-flex;align-items:center;gap:12px;font-size:.78rem;letter-spacing:.22em;font-weight:700;color:var(--accent-dark);margin-bottom:24px}
.hero-label svg{width:18px;height:18px;color:var(--accent)}
.hero h1{font-size:clamp(3.2rem,8.2vw,7rem);line-height:.96;letter-spacing:-.025em}
.hero h1 em{font-style:italic;color:var(--accent-dark);display:block;font-weight:400}
.hero-copy>p{margin:26px 0 36px;font-size:clamp(1.02rem,1.5vw,1.15rem);color:var(--text-2);max-width:470px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}
.hero-visual{position:relative;justify-self:end;width:100%;max-width:600px}
.hero-frame{position:relative;aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;box-shadow:var(--shadow-lg);background:var(--bg-2)}
.hero-frame img{width:100%;height:100%;object-fit:cover}
.js:not(.embed) .hero-frame img,.js:not(.embed) .story-img img{transform:translate3d(0,var(--py,0px),0) scale(1.1);will-change:transform}
.hero-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,24,22,0) 55%,rgba(25,24,22,.28));pointer-events:none}
.hero-moon{position:absolute;top:-22px;right:-16px;width:clamp(84px,13vw,140px);color:var(--accent);z-index:3}
.hero-card{position:absolute;left:-28px;bottom:42px;z-index:3;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:16px;padding:16px 20px;box-shadow:var(--shadow);max-width:230px;color:#27231F}
.hero-card small{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#7A6137;font-weight:700;margin-bottom:4px}
.hero-card span{font-family:var(--serif);font-size:1.25rem;line-height:1.2}
.hero-ring{position:absolute;z-index:0;width:520px;height:520px;right:-180px;top:-140px;border-radius:50%;border:1px solid var(--line);pointer-events:none}
.hero-ring.r2{width:760px;height:760px;right:-300px;top:-260px}
.fade-up{opacity:0;transform:translateY(24px);animation:fadeUp .9s var(--ease) forwards}
.fade-up.d1{animation-delay:.1s}.fade-up.d2{animation-delay:.22s}.fade-up.d3{animation-delay:.34s}
@keyframes fadeUp{to{opacity:1;transform:none}}

/* Ticker strip */
.strip{background:var(--dark);color:#DCCFB6;padding:18px 0;overflow:hidden;white-space:nowrap}
.strip-track{display:inline-flex;gap:48px;animation:marq 48s linear infinite;padding-left:48px}
.strip:hover .strip-track{animation-play-state:paused}
.strip-track span{font-family:var(--serif);font-size:1.35rem;font-style:italic;display:inline-flex;align-items:center;gap:48px}
.strip-track span::after{content:"☾";color:var(--accent);font-style:normal;font-size:1rem}
@keyframes marq{to{transform:translateX(-50%)}}
.strip.static{white-space:normal;text-align:center}
.strip.static .strip-track{animation:none;flex-wrap:wrap;justify-content:center;gap:10px 32px;padding:0 20px;display:flex}
.strip.static .strip-track span{gap:32px}
.strip.static .strip-track span:last-child::after{display:none}

/* Collections */
.coll-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:22px}
.coll-card{flex:1 1 260px;max-width:430px;position:relative;border-radius:var(--radius);overflow:hidden;background:var(--bg-2);aspect-ratio:4/5;display:flex;align-items:flex-end;isolation:isolate;transition:box-shadow .5s var(--ease),transform .5s var(--ease)}
.coll-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s var(--ease)}
.coll-card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(25,24,22,.02) 30%,rgba(25,24,22,.78))}
.coll-card:hover,.coll-card:focus-within{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.coll-card:hover img{transform:scale(1.06)}
.coll-body{padding:clamp(20px,2.6vw,30px);color:#fff;width:100%}
.coll-body h3{font-size:clamp(1.8rem,2.6vw,2.3rem);margin-bottom:6px}
.coll-link{color:#fff}
.coll-link::after{content:"";position:absolute;inset:0;z-index:2}
.coll-link:focus-visible{outline:none}
.coll-card:focus-within{outline:2px solid var(--accent-dark);outline-offset:3px}
.coll-body p{font-size:.98rem;color:rgba(255,255,255,.92);margin-bottom:14px}
.coll-body .link-arrow{color:#fff;border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:4px}
.coll-card:hover .link-arrow svg{transform:translateX(5px)}
.coll-num{position:absolute;top:18px;left:22px;font-family:var(--serif);font-size:1.05rem;color:#fff;letter-spacing:.1em}
.swipe-hint{display:none;margin-top:14px;font-size:.82rem;color:var(--text-2);text-align:center}

/* Shop */
.shop{background:var(--bg-2)}
.shop-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 24px;flex-wrap:wrap;margin-bottom:30px}
.shop-top .section-head{margin-bottom:0}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:10px 20px;border-radius:999px;border:1px solid #CDBFA9;font-size:.84rem;font-weight:600;letter-spacing:.02em;background:transparent;transition:all .3s;min-height:44px;white-space:nowrap}
.chip:hover{border-color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.sort-row{display:flex;justify-content:space-between;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-bottom:22px}
.filter-note{font-size:.92rem;color:var(--text-2);min-height:1.4em}
.filter-note button{text-decoration:underline;color:var(--accent-dark);font-weight:700}
.sort{display:inline-flex;align-items:center;gap:10px;font-size:.84rem;font-weight:600;color:var(--text-2)}
.sort select{font:inherit;font-size:.9rem;color:var(--text);background:var(--white);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.sort select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(185,154,98,.25)}
.product-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px;transition:opacity .28s,transform .28s}
.product-grid.fading{opacity:0;transform:translateY(10px)}
.p-card{flex:1 1 240px;max-width:320px;min-width:0;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:box-shadow .45s var(--ease),transform .45s var(--ease)}
.p-card.enter{animation:cardIn .6s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
.p-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-5px)}
.p-media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--bg-2);cursor:pointer}
.p-media img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.p-card:hover .p-media img{transform:scale(1.06)}
.p-badge{position:absolute;top:14px;left:14px;background:var(--dark);color:#F4E9D2;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:99px}
.p-tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
.p-tool{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .3s var(--ease)}
.p-tool:hover{transform:scale(1.1)}
.p-tool svg{width:19px;height:19px;fill:none;stroke:#27231F;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:fill .25s,stroke .25s}
.p-tool.wish[aria-pressed="true"] svg{fill:#B4533F;stroke:#B4533F}
.p-quick{position:absolute;left:12px;right:12px;bottom:12px;opacity:0;transform:translateY(10px);transition:all .4s var(--ease)}
.p-card:hover .p-quick,.p-quick:focus-within{opacity:1;transform:none}
.p-quick button{width:100%;min-height:44px;border-radius:999px;background:rgba(255,255,255,.96);color:#27231F;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.p-info{padding:18px 18px 20px;display:flex;flex-direction:column;gap:4px;flex:1}
.p-cat{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark);font-weight:700}
.p-name{font-family:var(--sans);font-weight:700;font-size:1.08rem;line-height:1.25;letter-spacing:0;margin:2px 0}
.p-name button{text-align:left;font:inherit;color:inherit}
.p-name button:hover{color:var(--accent-dark)}
.p-bottom{display:flex;flex-direction:column;gap:12px;margin-top:auto;padding-top:14px}
.price{font-weight:700;font-size:1.05rem}
.p-actions{display:flex;gap:8px}
.add-btn{min-height:44px;padding:0 18px;border-radius:999px;background:var(--text);color:var(--bg);font-size:.86rem;font-weight:600;letter-spacing:.02em;transition:background .3s,transform .3s;flex:1}
.add-btn:hover{background:var(--accent-dark);transform:translateY(-1px)}
.add-btn.icon{flex:none;width:44px;padding:0;display:grid;place-items:center;background:transparent;color:var(--text);border:1px solid #CDBFA9}
.add-btn.icon:hover{background:var(--bg-2);border-color:var(--text);transform:none}
.add-btn.icon svg{width:20px;height:20px}
.empty-state{flex:1 1 100%;max-width:none;text-align:center;padding:56px 20px;color:var(--text-2)}
.empty-state h3{color:var(--text);font-size:2rem;margin-bottom:8px}
.custom-nudge{margin:34px auto 0;max-width:720px;display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;background:var(--white);border:1px dashed #CDBFA9;border-radius:var(--radius);padding:22px 26px}
.custom-nudge p{font-family:var(--serif);font-size:1.45rem;line-height:1.2}
.custom-nudge[hidden]{display:none}
.shop-foot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:44px;text-align:center}
.demo-note{font-size:.84rem;color:var(--text-2);max-width:560px}

/* Story */
.story{overflow:hidden}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,7vw,110px);align-items:center}
.story-media{position:relative}
.story-img{aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);background:var(--bg-2)}
.story-img img{width:100%;height:100%;object-fit:cover}
.story-img2{position:absolute;right:-6%;bottom:-8%;width:42%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:8px solid var(--bg);box-shadow:var(--shadow);background:var(--bg-2)}
.story-img2 img{width:100%;height:100%;object-fit:cover}
.story-moon{position:absolute;top:-30px;left:-26px;width:104px;color:var(--accent);z-index:2}
.story-copy h2{font-size:clamp(2.4rem,5vw,4.2rem);margin:16px 0 26px}
.story-copy h2 em{color:var(--accent-dark)}
.story-copy p{color:var(--text-2);margin-bottom:16px;font-size:1.06rem;max-width:520px}
.story-copy p.quote{font-family:var(--serif);font-style:italic;font-size:1.55rem;color:var(--text);line-height:1.3;margin:24px 0 32px}

/* How it works */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(18px,3vw,36px)}
.step{position:relative;padding:32px 28px 38px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);transition:transform .5s var(--ease),box-shadow .5s}
.step:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.step-n{font-family:var(--serif);font-size:4.6rem;line-height:1;color:var(--accent);font-style:italic;margin-bottom:16px;display:block}
.step h3{font-size:1.9rem;margin-bottom:10px}
.step p{color:var(--text-2)}
.step::after{content:"";position:absolute;left:28px;bottom:0;width:48px;height:2px;background:var(--accent)}

/* Custom gift (dark) */
.custom{background:var(--dark);color:#EFE7D8;overflow:hidden}
.custom-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(34px,6vw,90px);align-items:start}
.custom .eyebrow{color:var(--accent)}
.custom h2{font-size:clamp(2.3rem,4.6vw,3.9rem);margin:16px 0 20px;color:#fff}
.custom .lead{color:#CBC2B2;max-width:450px;font-size:1.05rem}
.custom-points{margin-top:32px;display:grid;gap:14px}
.custom-points li{display:flex;gap:14px;align-items:center;color:#DDD3C1;font-size:.98rem}
.custom-points svg{width:20px;height:20px;color:var(--accent)}
.form-card{background:var(--bg);color:var(--text);border-radius:24px;padding:clamp(22px,4vw,42px);box-shadow:var(--shadow-lg)}
.fsteps{display:flex;gap:8px;margin-bottom:12px}
.fsteps li{flex:1;display:flex;align-items:center;gap:10px;font-size:.84rem;font-weight:600;color:var(--text-2);min-width:0}
.fsteps li span.n{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid #CDBFA9;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--white)}
.fsteps li span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsteps li.current{color:var(--text)}
.fsteps li.current span.n{background:var(--text);color:var(--bg);border-color:var(--text)}
.fsteps li.done span.n{background:var(--accent);border-color:var(--accent);color:var(--dark)}
.fprog{height:4px;border-radius:4px;background:var(--line);margin-bottom:26px;overflow:hidden}
.fprog i{display:block;height:100%;background:var(--accent-dark);border-radius:4px;transition:width .45s var(--ease)}
.form-step{display:none;grid-template-columns:1fr 1fr;gap:18px}
.form-step.active{display:grid}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.field label i{color:#A8432F;font-style:normal}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:1rem;color:var(--text);background:var(--white);border:1px solid #D6CAB8;border-radius:12px;padding:13px 15px;min-height:50px;transition:border-color .25s,box-shadow .25s}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent-dark);box-shadow:0 0 0 3px rgba(185,154,98,.28)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:#B4533F}
.err{font-size:.84rem;color:#A8432F;display:none}
.field.invalid .err{display:block}
.based-on{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.92rem}
.based-on[hidden]{display:none}
.based-on button{margin-left:auto;text-decoration:underline;color:var(--accent-dark);font-weight:600;min-height:32px}
.form-nav{margin-top:24px;display:flex;gap:12px}
.form-nav .btn{flex:1}
.form-nav .btn[hidden]{display:none}
.form-nav .btn-back{flex:0 0 auto}
.form-hint{font-size:.84rem;color:var(--text-2);text-align:center;margin-top:14px}
.wa-done{display:none;text-align:center}
.wa-done.show{display:block}
.wa-done .tick{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--dark);display:grid;place-items:center;margin:0 auto 14px}
.wa-done .tick svg{width:30px;height:30px}
.wa-done h3{font-size:2.1rem;margin-bottom:8px}
.wa-done .status{font-size:.95rem;color:var(--text-2);margin-bottom:16px}
.wa-done pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.9rem;text-align:left;background:var(--white);border:1px solid var(--line);padding:14px;border-radius:12px;margin:0 0 16px;max-height:220px;overflow:auto}
.wa-done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wa-done .btn{min-height:44px;padding:0 20px}
.form-card.sent form{display:none}

/* Reviews */
.reviews{background:var(--bg-2)}
.review-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.review{flex:1 1 300px;max-width:520px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:30px;display:flex;flex-direction:column;gap:18px}
.review blockquote{margin:0;font-family:var(--serif);font-size:1.55rem;line-height:1.3;font-style:italic}
.review .who{font-size:.9rem;color:var(--text-2);display:flex;align-items:center;gap:12px;margin-top:auto}
.review .who i{width:38px;height:38px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;font-family:var(--serif);font-style:normal;color:var(--accent-dark);font-size:1.1rem}

/* Instagram */
.insta-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 24px;flex-wrap:wrap;margin-bottom:36px}
.insta-head .section-head{margin-bottom:0}
.handle{font-family:var(--serif);font-size:1.6rem;color:var(--accent-dark);margin-top:10px;display:block}
.insta-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.insta-item{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg-2);display:block}
.insta-item img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.insta-item::after{content:"";position:absolute;inset:0;background:rgba(25,24,22,.4);opacity:0;transition:opacity .4s}
.insta-item svg{position:absolute;z-index:2;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-30%);color:#fff;opacity:0;transition:all .4s var(--ease)}
.insta-item:hover img,.insta-item:focus-visible img{transform:scale(1.08)}
.insta-item:hover::after,.insta-item:focus-visible::after{opacity:1}
.insta-item:hover svg,.insta-item:focus-visible svg{opacity:1;transform:translate(-50%,-50%)}
.follow-card{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:space-between;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,4vw,40px)}
.follow-card .fc-ig{width:56px;height:56px;border-radius:16px;background:var(--bg-2);color:var(--accent-dark);display:grid;place-items:center}
.follow-card .fc-ig svg{width:28px;height:28px}
.follow-card .fc-text{flex:1;min-width:220px}
.follow-card .fc-text b{display:block;font-family:var(--serif);font-size:1.8rem;font-weight:500;line-height:1.1}
.follow-card .fc-text span{color:var(--text-2)}

/* FAQ */
.faq{background:var(--bg-2)}
.faq-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(30px,6vw,90px)}
.faq-list{border-top:1px solid #CDBFA9}
.faq-item{border-bottom:1px solid #CDBFA9}
.faq-item h3{font-family:inherit;font-size:inherit;letter-spacing:0}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;text-align:left;padding:22px 0;font-family:var(--sans);font-weight:600;font-size:clamp(1.02rem,1.6vw,1.2rem);line-height:1.35;min-height:44px}
.faq-q .pm{position:relative;width:30px;height:30px;flex:none;border:1px solid #BBAA90;border-radius:50%;transition:background .3s,transform .4s var(--ease)}
.faq-q .pm::before,.faq-q .pm::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:1.5px;background:var(--text);transform:translate(-50%,-50%)}
.faq-q .pm::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .4s var(--ease)}
.faq-q[aria-expanded="true"] .pm{background:var(--accent)}
.faq-q[aria-expanded="true"] .pm::after{transform:translate(-50%,-50%) rotate(0)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.faq-a>div{overflow:hidden;visibility:hidden;transition:visibility 0s .45s}
.faq-a p{padding:0 48px 24px 0;color:var(--text-2)}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-item.open .faq-a>div{visibility:visible;transition-delay:0s}

/* Contact */
.contact{text-align:center;overflow:hidden}
.contact-box{position:relative;border-radius:32px;background:linear-gradient(135deg,var(--bg-2),var(--line));padding:clamp(44px,7vw,96px) clamp(20px,5vw,60px);border:1px solid var(--line)}
.contact-box .moon{position:absolute;width:clamp(110px,18vw,200px);right:5%;top:-28px;color:var(--accent);opacity:.7}
.contact-box h2{font-size:clamp(2.5rem,6vw,4.8rem);margin:14px 0 16px}
.contact-box>p{color:var(--text-2);font-size:1.15rem;margin:0 auto 36px;max-width:520px}
.contact-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:960px;margin:0 auto;text-align:left}
.contact-card{flex:1 1 240px;max-width:310px;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.contact-card .cc-ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--accent-dark);margin-bottom:6px}
.contact-card .cc-ic svg{width:22px;height:22px}
.contact-card b{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark)}
.contact-card .cc-val{font-weight:600;overflow-wrap:anywhere}
.contact-card .cc-act{margin-top:8px;align-self:flex-start;font-size:.88rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px;display:inline-flex;align-items:center}
.contact-note{margin-top:26px;color:var(--text-2);font-size:.95rem}

/* Footer */
.footer{background:var(--dark);color:#CBC2B2;padding:clamp(52px,8vw,92px) 0 28px;position:relative;overflow:hidden}
.footer-moon{position:absolute;right:-60px;top:-60px;width:320px;color:var(--accent);opacity:.1}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px;position:relative}
.footer .brand-block{display:flex;align-items:center;gap:12px}
.footer .brand-block svg{width:40px;height:40px}
.footer .brand-block img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.footer .brand-text b{color:#fff;font-size:1.5rem;letter-spacing:.2em}
.footer-tag{font-family:var(--serif);font-style:italic;font-size:1.6rem;color:#EBE1CF;margin:22px 0 10px;max-width:340px;line-height:1.25}
.footer h4{font-family:var(--sans);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;font-weight:700}
.footer li{margin-bottom:6px}
.footer li a{transition:color .25s;display:inline-block;padding:5px 0}
.footer li a:hover{color:#fff}
.footer-bottom{margin-top:52px;padding-top:24px;border-top:1px solid #34312B;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.88rem;position:relative}

/* Drawer, modals, search, toasts */
.overlay{position:fixed;inset:0;background:rgba(25,24,22,.5);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;z-index:190;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.overlay.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;height:100dvh;width:min(440px,100%);background:var(--bg);z-index:200;transform:translateX(105%);transition:transform .5s var(--ease),visibility .5s;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);visibility:hidden}
.drawer.show{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:1.9rem}
.drawer-body{flex:1;overflow-y:auto;padding:8px 24px}
.cart-item{display:grid;grid-template-columns:78px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.cart-item img{width:78px;height:96px;object-fit:cover;border-radius:10px;background:var(--bg-2)}
.ci-name{font-family:var(--sans);font-weight:700;font-size:1rem;line-height:1.25}
.ci-cat{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);font-weight:700}
.ci-price{font-size:.9rem;color:var(--text-2);margin-top:2px}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ci-line{font-weight:700;font-size:.95rem}
.ci-remove{font-size:.82rem;text-decoration:underline;color:var(--text-2);min-height:32px}
.ci-remove:hover{color:#A8432F}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--white);margin-top:8px}
.qty button{width:40px;height:40px;font-size:1.15rem;border-radius:50%;display:grid;place-items:center}
.qty button:hover{background:var(--bg-2)}
.qty output{min-width:28px;text-align:center;font-weight:600;font-size:.95rem}
.drawer-foot{padding:18px 24px 24px;border-top:1px solid var(--line);background:var(--white)}
.drawer-foot[hidden]{display:none}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.subtotal span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--text-2)}
.subtotal b{font-family:var(--serif);font-size:2rem;font-weight:500}
.drawer-foot .note{font-size:.84rem;color:var(--text-2);margin-bottom:16px}
.drawer-foot .btn{width:100%;margin-bottom:10px}
.cart-empty{text-align:center;padding:64px 10px;color:var(--text-2)}
.cart-empty svg{width:54px;height:54px;color:var(--accent);margin:0 auto 16px}
.cart-empty h4{color:var(--text);font-size:1.8rem;margin-bottom:6px}
.cart-empty .btn{margin-top:22px}
.modal{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:20px;visibility:hidden;pointer-events:none}
.modal.show{visibility:visible;pointer-events:auto}
.modal-card{position:relative;background:var(--bg);width:min(940px,100%);max-height:calc(100dvh - 40px);overflow:auto;border-radius:24px;display:grid;grid-template-columns:1fr 1fr;transform:translateY(24px) scale(.98);opacity:0;transition:all .45s var(--ease);box-shadow:var(--shadow-lg)}
.modal.show .modal-card{transform:none;opacity:1}
.modal-gallery{background:var(--bg-2);display:flex;flex-direction:column}
.modal-gallery .main{flex:1;min-height:340px}
.modal-gallery .main img{width:100%;height:100%;object-fit:cover;min-height:340px;max-height:620px}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{flex:0 0 60px;height:60px;border-radius:10px;overflow:hidden;border:2px solid transparent;opacity:.75}
.thumbs button[aria-current="true"]{border-color:var(--accent-dark);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:12px}
.modal-body h3{font-size:clamp(2rem,3.4vw,2.7rem)}
.modal-body .desc{color:var(--text-2)}
.modal-body .price{font-size:1.5rem;font-family:var(--serif);font-weight:500}
.modal-body h4{font-family:var(--sans);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:700;margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts li{border:1px solid #CDBFA9;border-radius:999px;padding:6px 14px;font-size:.88rem;background:var(--white)}
.modal-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.modal-row .qty{margin-top:0}
.modal-row .btn{flex:1;min-width:150px}
.modal-close{position:absolute;top:12px;right:12px;z-index:3;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.modal-close svg{width:22px;height:22px;stroke:#27231F}
.search-panel{position:fixed;left:0;right:0;top:0;z-index:205;background:var(--bg);padding:26px 0 30px;transform:translateY(-105%);transition:transform .5s var(--ease),visibility .5s;box-shadow:var(--shadow-lg);visibility:hidden}
.search-panel.show{transform:none;visibility:visible}
.search-row{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--text);padding-bottom:10px}
.search-row>svg{width:24px;height:24px}
.search-row input{flex:1;border:0;background:transparent;font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.6rem);color:var(--text);min-width:0;padding:6px 0}
.search-row input:focus{outline:none}
.search-row .icon-btn svg{stroke:var(--text)}
.search-results{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;min-height:44px;align-items:center}
.search-results button{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:.9rem;min-height:44px;transition:all .25s}
.search-results button:hover{border-color:var(--accent);background:var(--bg-2)}
.search-results p{color:var(--text-2);font-size:.95rem}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{background:var(--dark);color:#F4ECDC;padding:13px 22px;border-radius:999px;font-size:.92rem;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .5s var(--ease) both;max-width:100%}
.toast svg{width:16px;height:16px;color:var(--accent)}
.toast.out{animation:toastOut .4s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
.float-btn{position:fixed;bottom:20px;z-index:90;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .35s var(--ease),opacity .3s,visibility .3s}
.float-btn:hover{transform:translateY(-3px)}
.float-btn svg{width:26px;height:26px}
.wa-float{right:20px;background:#1F7A4D;color:#fff}
.admin-float{left:20px;width:auto;height:48px;padding:0 18px 0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;background:#191816;color:#fff;font-size:.88rem;font-weight:600;letter-spacing:.01em;border:1px solid rgba(255,255,255,.18)}
.admin-float svg{width:20px;height:20px}
.admin-float:hover,.admin-float:focus-visible{background:#000}

/* Reveal */
.js .reveal{opacity:0;transform:translateY(42px) scale(.985);transition:opacity 1.1s var(--ease),transform 1.25s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
.js .reveal.in{opacity:1;transform:none}
html.embed .reveal{opacity:1!important;transform:none!important;transition:none!important}
/* headings rise word by word */
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .08em .14em 0;margin:0 -.08em -.14em 0}
.split .w>span{display:inline-block;transform:translate3d(0,108%,0);transition:transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i,0)*75ms)}
.split.w-in .w>span{transform:none}
html.no-reveal .split .w>span{transform:none!important;transition:none!important}
/* story photo is unveiled with a soft wipe */
.fancy .story-media.reveal .story-img{clip-path:inset(100% 0 0 0);transition:clip-path 1.6s cubic-bezier(.77,0,.18,1) .1s}
.fancy .story-media.reveal.in .story-img{clip-path:inset(0 0 0 0)}
/* scroll-linked depth: the layers drift at different speeds as you scroll (uses the independent `translate` property so it never fights hover/reveal transforms) */
.fancy .hero-moon,.fancy .story-moon{transform-box:fill-box;transform-origin:center}
.fancy .hero-copy{translate:0 calc(var(--hp,0)*64px);opacity:calc(1 - var(--hp,0)*1.15)}
.fancy .hero-visual{translate:0 calc(var(--hp,0)*-28px)}
.fancy .hero-frame{scale:calc(1 - var(--hp,0)*.07)}
.fancy .hero-card{translate:0 calc(var(--hp,0)*-110px)}
.fancy .hero-moon{translate:0 calc(var(--hp,0)*-60px);rotate:calc(var(--hp,0)*50deg)}
.fancy .hero-ring{translate:0 calc(var(--hp,0)*140px);scale:calc(1 + var(--hp,0)*.18)}
.fancy .story-moon{rotate:calc(var(--sp,0)*60deg);translate:0 calc(var(--sp,0)*-26px)}
.fancy .story-img2{translate:0 calc(var(--sp,0)*-46px)}
.fancy .coll-card:nth-child(odd){translate:0 calc(var(--sp,0)*22px)}
.fancy .coll-card:nth-child(even){translate:0 calc(var(--sp,0)*-22px)}
.fancy .step:nth-child(even){translate:0 calc(var(--sp,0)*-16px)}
.fancy .step:nth-child(odd){translate:0 calc(var(--sp,0)*10px)}
/* photos settle in (a slow zoom-out) as their card is revealed */
.js:not(.embed) .coll-card.reveal img,.js:not(.embed) .p-card.reveal .p-media img{transform:scale(1.16)}
.js:not(.embed) .coll-card.reveal.in img,.js:not(.embed) .p-card.reveal.in .p-media img{transform:scale(1);transition:transform 2s cubic-bezier(.16,1,.3,1)}
html.embed .fade-up,html.embed .p-card.enter{animation:none!important;opacity:1;transform:none}
html.no-reveal .reveal{opacity:1!important;transform:none!important;transition:none!important}

/* ===== Responsive ===== */
@media (max-width:1100px){
  .insta-grid{grid-template-columns:repeat(3,1fr)}
  .hero-card{left:-8px}
  .footer-grid{grid-template-columns:1fr 1fr 1fr}
  .footer-grid>div:first-child{grid-column:1/-1}
}
@media (max-width:900px){
  :root{--header-h:84px}
  .navbar{gap:8px;padding:6px 6px 6px 7px}
  .nav-toggle{display:grid}
  .nav-cta.desk{display:none}
  .tool-search{display:none}
  .brand-mark{width:46px;height:46px}
  .brand-mark svg{width:28px;height:28px}
  .nav-panel{position:absolute;top:calc(100% + 10px);left:0;right:0;flex-direction:column;align-items:stretch;gap:6px;padding:16px;background:var(--nav);border-radius:26px;box-shadow:0 30px 60px rgba(20,18,30,.3);opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .35s,transform .45s var(--ease),visibility .35s}
  .nav-panel.open{opacity:1;visibility:visible;transform:none}
  .nav-links{flex-direction:column;gap:2px;width:100%}
  .nav-links a{display:block;padding:14px 14px;font-size:1.08rem;border-radius:14px}
  .nav-links a::after{display:none}
  .nav-links a:hover,.nav-links a[aria-current="true"]{background:rgba(255,255,255,.1)}
  .panel-extra{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
  .panel-extra .nav-cta{height:52px}
  .panel-search{display:flex;align-items:center;gap:12px;color:#fff;font-weight:600;padding:12px 14px;border-radius:14px;min-height:48px;text-align:left}
  .panel-search:hover{background:rgba(255,255,255,.1)}
  .panel-search svg{width:20px;height:20px}
  .hero-grid{grid-template-columns:1fr;min-height:0}
  .hero-visual{justify-self:center;max-width:480px}
  .hero-card{left:8px;bottom:24px}
  .story-grid,.custom-grid,.faq-grid{grid-template-columns:1fr}
  .story-media{max-width:520px;margin:0 auto 20px}
  .modal-card{grid-template-columns:1fr}
  .modal-gallery .main,.modal-gallery .main img{min-height:240px;max-height:340px}
  .footer-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  :root{--header-h:80px}
  .container{width:calc(100% - 32px)}
  .site-header{padding:10px 0 8px}
  .navbar{width:calc(100% - 24px)}
  .brand{gap:9px}
  .brand-text b{font-size:1.25rem;letter-spacing:.12em}
  .brand-text small{font-size:.62rem;letter-spacing:.3em}
  .nav-tools .icon-btn{width:42px;height:42px}
  .announce{font-size:.74rem;letter-spacing:.08em;padding:9px 12px}
  .announce .m{display:none}
  .hero-cta .btn{flex:1 1 100%}
  .hero-card{display:none}
  /* collections → swipeable carousel */
  .coll-grid{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;margin-inline:-16px;padding:2px 16px 12px;scrollbar-width:none}
  .coll-grid::-webkit-scrollbar{display:none}
  .coll-card{flex:0 0 78%;max-width:none;scroll-snap-align:center}
  .swipe-hint{display:block}
  /* chips → one swipeable row */
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none;width:calc(100% + 32px);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chip{scroll-snap-align:start}
  .shop-top{display:block}
  .shop-top .chips{margin-top:22px}
  .sort-row{flex-direction:column;align-items:flex-start}
  .product-grid{gap:14px 12px}
  .p-card{flex-basis:150px}
  .p-info{padding:12px 12px 14px}
  .p-name{font-size:.98rem}
  .p-cat{font-size:.7rem;letter-spacing:.1em}
  .p-quick{display:none}
  .p-tool{width:38px;height:38px}
  .p-badge{font-size:.68rem;top:10px;left:10px;padding:5px 10px}
  .add-btn{padding:0 10px;font-size:.84rem}
  .form-step{grid-template-columns:1fr}
  .fsteps li span.t{display:none}
  .fsteps li.current span.t{display:inline;max-width:none}
  .fsteps li.current{flex:3}
  .insta-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .faq-a p{padding-right:0}
  .footer-grid{grid-template-columns:1fr}
  .cart-item{grid-template-columns:64px 1fr auto;gap:12px}
  .cart-item img{width:64px;height:80px}
  .modal{padding:0;align-items:end}
  .modal-card{border-radius:24px 24px 0 0;max-height:92dvh}
  .story-img2{right:-2%}
  .contact-box{border-radius:24px}
  .float-btn{bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px}
  .float-btn svg{width:23px;height:23px}
  .wa-float{right:14px}
  .admin-float{left:14px;width:auto;height:44px;padding:0 14px 0 12px;font-size:.82rem}
  .admin-float svg{width:18px;height:18px}
  .wa-float.away,.admin-float.away{transform:translateY(90px);opacity:0;visibility:hidden}
  .toasts{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .custom-nudge{padding:18px}
  .custom-nudge p{font-size:1.25rem}
}
@media (max-width:360px){
  .brand-text small{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .site-header,.navbar{transition:none!important}
  .site-header.scrolled .navbar{transform:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .fade-up{opacity:1!important;transform:none!important}
  .js .reveal{transform:none!important;transition:opacity .9s var(--ease)!important}
  .js .reveal img{transform:none!important}
  .strip-track{animation:none}
}

(function () {
  'use strict';
  const LZ = (window.LZ = window.LZ || {});

  LZ.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  LZ.uid = (n) => {
    n = n || 6;
    const a = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.from(a, (b) => (b % 36).toString(36)).join('');
  };

  LZ.clone = (o) => JSON.parse(JSON.stringify(o));

  LZ.slug = (s) =>
    String(s || '')
      .toLowerCase()
      .normalize('NFKD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 40) || 'item';

  /* Page sections: key -> element id on the page */
  LZ.SECTIONS = [
    { key: 'hero', id: 'home', label: 'Hero' },
    { key: 'strip', id: 'strip', label: 'Ticker strip' },

  /* ---------- custom gift form (3 steps) ---------- */
  const FIELD = { occasion: '#f-occasion', type: '#f-type', recipient: '#f-recipient', msg: '#f-msg', date: '#f-date', name: '#f-name', contact: '#f-contact' };
  const STEP_FIELDS = { 1: ['occasion', 'type', 'recipient'], 2: ['msg', 'date'], 3: ['name', 'contact'] };
  function minDate() {
    const d = new Date();
    d.setDate(d.getDate() + (Number(S().leadTimeDays) || 0));
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  const RULES = {
    name: (v) => (v.trim().length >= 2 ? '' : 'Please enter your name.'),
    contact: (v) => {
      v = v.trim();
      if (!v) return 'Please enter an email or WhatsApp number.';
      const email = LZ.emailOK(v), phone = /^\+?[\d\s()-]{8,18}$/.test(v) && v.replace(/\D/g, '').length >= 8;
      return email || phone ? '' : 'Enter a valid email, or a phone number with at least 8 digits.';
    },
    occasion: (v) => (v ? '' : 'Please choose an occasion.'),
    type: (v) => (v ? '' : 'Please choose a gift type.'),
    recipient: (v) => (v.trim() ? '' : 'Please tell us who the gift is for.'),
    msg: (v) => (v.trim().length >= 10 ? '' : 'Please add a few details (at least 10 characters).'),
    date: (v) => (!v || v >= minDate() ? '' : 'Please choose a date on or after ' + minDate().split('-').reverse().join('/') + '.'),
  };
  function validateField(k) {
    const input = $(FIELD[k]);
    if (!input) return true;
    const msg = RULES[k](input.value);
    input.closest('.field').classList.toggle('invalid', !!msg);
    $('#e-' + k).textContent = msg;
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    input.setAttribute('aria-describedby', 'e-' + k);
    return !msg;
  }
  function validateStep(n) {
    const results = STEP_FIELDS[n].map((k) => validateField(k));
    if (results.includes(false)) {
      const bad = $('.form-step[data-step="' + n + '"] .field.invalid input, .form-step[data-step="' + n + '"] .field.invalid select, .form-step[data-step="' + n + '"] .field.invalid textarea');
      if (bad) bad.focus();
      return false;
    }
    return true;
  }
  function goStep(n, focus) {
    const form = $('#giftForm');
    if (!form) return;
    ui.step = n;
    $$('.form-step', form).forEach((s) => s.classList.toggle('active', +s.dataset.step === n));
    $$('#fsteps li').forEach((li) => {
      const i = +li.dataset.i;

    });
    $('#fprog').style.width = (n / 3) * 100 + '%';
    $('[data-form-back]').hidden = n === 1;
    $('[data-form-next]').hidden = n === 3;
    $('#formSubmit').hidden = n !== 3;
    const label = ($$('#fsteps li .t')[n - 1] || {}).textContent || '';
    $('#stepLive').textContent = `Step ${n} of 3: ${label}`;
    if (focus) { const f = $('.form-step.active input, .form-step.active select, .form-step.active textarea', form); if (f) f.focus({ preventScroll: true }); }
  }
  function nextStep() {

  function updateBased() {

  function customize(id) {

  function submitForm() {
    for (let n = 1; n <= 3; n++) {
      if (!STEP_FIELDS[n].map((k) => validateField(k)).every(Boolean)) {
        goStep(n, false);
        validateStep(n);

    const budget = $('#f-budget').value || 'Not sure yet';

    }
    const lines = [
      `Hello ${LZ.fullName(S())}! ✨ I'd like to discuss a custom gift.`, '',
      `*Name:* ${v('name')}`, `*Contact:* ${v('contact')}`, `*Occasion:* ${v('occasion')}`, `*Gift type:* ${v('type')}`,
      `*Recipient:* ${v('recipient')}`,
    ];
    if (ui.based) lines.push(`*Inspired by:* ${ui.based.name}`);
    lines.push(`*Budget:* ${budget}`, `*Preferred delivery date:* ${dateTxt}`, '', '*Message / requirements:*', v('msg'), '',
      'Could you please confirm availability, customization options, pricing and delivery? Thank you!');
    const msg = lines.join('\n');
    const opened = openWhatsApp(msg);
    $('#waText').textContent = msg;
    $('#waLink').href = LZ.waURL(S(), msg);
    $('#waStatus').textContent = opened
      ? (LZ.waConfigured(S())
        ? 'WhatsApp should have opened in a new tab. Press send there to share your request — nothing is sent until you do.'
        : 'WhatsApp should have opened with your message ready. Choose our contact there and press send — nothing is sent until you do.')
      : 'Your browser blocked the new tab, so nothing has been sent. Use “Open WhatsApp again”, or copy the message.';
    $('#formCard').classList.add('sent');

  function resetForm() {

  function setupForm() {

  /* ---------- images: never show a broken icon ---------- */
  function sweepImages() {
    $$('img').forEach((i) => { if (i.complete && i.naturalWidth === 0 && i.getAttribute('src') && !i.dataset.fb) LZ.imgError(i); });
  }

  /* ---------- headings that rise word by word ---------- */
  let ioWords = null;
  function splitHeadings() {
    if (ioWords) { ioWords.disconnect(); ioWords = null; }
    const hs = $$('.section-head h2, .story-copy h2, .cta-band h2, .custom h2').filter((h) => !h.classList.contains('split'));
    if (!hs.length) return;
    if (!FANCY || !('IntersectionObserver' in window) || (D.theme || {}).reveal === false) return;
    let n = 0;
    const walk = (node) => {
      Array.from(node.childNodes).forEach((c) => {
        if (c.nodeType === 3) {
          const frag = document.createDocumentFragment();
          c.textContent.split(/(\s+)/).forEach((part) => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
            const w = document.createElement('span'); w.className = 'w';
            const i = document.createElement('span'); i.textContent = part; i.style.setProperty('--i', String(n++));
            w.appendChild(i); frag.appendChild(w);
          });
          node.replaceChild(frag, c);
        } else if (c.nodeType === 1) walk(c);
      });
    };
    ioWords = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add('w-in'); ioWords.unobserve(en.target); }
    }), { threshold: 0.35, rootMargin: '0px 0px -8% 0px' });
    hs.forEach((h) => { n = 0; walk(h); h.classList.add('split'); ioWords.observe(h); });
  }

  /* ---------- reveal on scroll ---------- */
  let io = null;
  function initReveal() {
    if (io) io.disconnect();
    const els = $$('.reveal:not(.in)');
    if (!('IntersectionObserver' in window) || EMBED || (D.theme || {}).reveal === false) { els.forEach((e) => e.classList.add('in')); return; }
    io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (!en.isIntersecting) return;
      const t = en.target;
      t.classList.add('in'); io.unobserve(t);
      // once it has settled, hand the element back to its normal hover/focus styling
      setTimeout(() => { t.classList.remove('reveal', 'in'); t.style.removeProperty('--d'); }, 2400);
    }), { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });
    els.forEach((e) => io.observe(e));
  }

  /* ---------- render everything ---------- */
  function renderPage(keepScroll) {
    const y = window.scrollY;
    if (ui.filter !== 'All' && ui.filter !== '__wish' && !(D.collections || []).some((c) => c.id === ui.filter && c.visible !== false)) ui.filter = 'All';
    LZ.renderPage(D, ui);
    renderChips();
    renderGrid(false);
    renderCart();
    updateBadges();
    setupForm();
    setWA();
    splitHeadings();
    initReveal();
    setHeaderHeight();
    sweepImages();
    updateActive();
    onScrollFrame();
    if (keepScroll) window.scrollTo(0, y);

  function boot(d) {
    if (!d) {
      $('#main').innerHTML = '<p style="padding:90px 20px;text-align:center">Content could not be loaded. Please refresh the page.</p>';
      return;
    }
    D = normalize(d);
    applyTheme();
    applyDoc();
    renderPage(false);
    if (location.hash && location.hash.length > 1) {
      const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) setTimeout(() => el.scrollIntoView(), 50);
    }
  }

  /* ---------- events (delegated, so re-rendering never breaks them) ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target;
    let el;

    if (t.closest('a[href="#admin"]')) { e.preventDefault(); if (window.__lzOpenAdmin) window.__lzOpenAdmin(); return; }
    if (t.closest('[data-close]')) { closeLayer(); return; }
    if ((el = t.closest('[data-close-goto]'))) { closeLayer(true); setTimeout(() => gotoSection(el.dataset.closeGoto), 250); return; }
    if (t.id === 'overlay') { closeLayer(); return; }
    if (t.classList && t.classList.contains('modal') && activeLayer === 'quick') { closeLayer(); return; }

    if ((el = t.closest('[data-cat]'))) { e.preventDefault(); setFilter(el.dataset.cat, true); return; }
    if ((el = t.closest('[data-goto]'))) { e.preventDefault(); closeMenu(); gotoSection(el.dataset.goto); return; }
    if ((el = t.closest('a[href^="#"]')) && el.getAttribute('href').length > 1 && !e.defaultPrevented && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
      let tid = '';
      try { tid = decodeURIComponent(el.getAttribute('href').slice(1)); } catch (err) { tid = ''; }
      const target = tid && document.getElementById(tid);
      if (target) {
        e.preventDefault();
        closeMenu();
        if (target.id === 'main' || target.hasAttribute('tabindex')) { try { target.focus({ preventScroll: true }); } catch (err) { /* ignore */ } }
        scrollToEl(target);
        try { history.replaceState(null, '', '#' + target.id); } catch (err) { /* file:// restrictions */ }
        return;
      }
    }
    if (t.closest('#navPanel a, #navPanel button')) { if (t.closest('[data-open-search]')) { closeMenu(); $('#searchInput').value = ''; renderSearch(''); openLayer('search', $('#menuBtn')); return; } closeMenu(); }
    if (t.closest('#menuBtn')) { toggleMenu(); return; }
    if (t.closest('#searchBtn')) { $('#searchInput').value = ''; renderSearch(''); openLayer('search', t.closest('#searchBtn')); return; }
    if (t.closest('#wishBtn')) { closeMenu(); setFilter('__wish', true); return; }
    if (t.closest('#cartBtn')) { openLayer('cart', t.closest('#cartBtn')); return; }

    if ((el = t.closest('[data-chip]'))) { setFilter(el.dataset.chip); return; }
    if (t.closest('#viewAll')) { setFilter('All'); return; }

    const card = t.closest('.p-card');
    if (card) {
      const id = card.dataset.id;
      const act = t.closest('[data-act]');
      if (act) {
        const a = act.dataset.act;
        if (a === 'add') addToCart(id, 1);
        else if (a === 'wish') toggleWish(id);
        else if (a === 'quick') openQuick(id, act);
        else if (a === 'custom') customize(id);
        return;
      }
      if (t.closest('.p-media')) { openQuick(id, card.querySelector('[data-act="quick"]')); return; }
    }

    if ((el = t.closest('#cartBody .cart-item'))) {
      const id = el.dataset.id, line = cart.find((i) => i.id === id);
      const q = t.closest('[data-q]');
      if (q && line) { line.qty = Math.min(20, line.qty + Number(q.dataset.q)); if (line.qty < 1) cart = cart.filter((i) => i.id !== id); saveCart(); return; }
      if (t.closest('[data-remove]')) { cart = cart.filter((i) => i.id !== id); saveCart(); toast('Removed from your list'); return; }
    }
    if (t.closest('#cartClear')) { cart = []; saveCart(); toast('Your list is now empty'); return; }
    if (t.closest('#cartWa')) {
      const lines = cartLines().map((l) => { const p = byId(l.id); return `• ${p.name} × ${l.qty} — ${LZ.money(p.price * l.qty, S().currency)}`; });
      const total = cartLines().reduce((s, l) => s + byId(l.id).price * l.qty, 0);
      openWhatsApp(`Hello ${LZ.fullName(S())}! ✨\nI'd like to enquire about these creations:\n\n${lines.join('\n')}\n\nEstimated from: ${LZ.money(total, S().currency)} (starting prices)\n\nCould you please confirm availability, customization options, pricing and delivery?`);

    }

    if ((el = t.closest('[data-qv-img]'))) { ui.qv.idx = Number(el.dataset.qvImg); fillQuick(); return; }
    if (t.closest('#qv-minus')) { ui.qv.qty = Math.max(1, ui.qv.qty - 1); $('#qv-qty').textContent = ui.qv.qty; return; }
    if (t.closest('#qv-plus')) { ui.qv.qty = Math.min(20, ui.qv.qty + 1); $('#qv-qty').textContent = ui.qv.qty; return; }
    if (t.closest('#qv-add')) { addToCart(ui.qv.id, ui.qv.qty); closeLayer(); return; }
    if (t.closest('#qv-wish')) { toggleWish(ui.qv.id); return; }
    if (t.closest('#qv-custom')) { customize(ui.qv.id); return; }

    if ((el = t.closest('[data-scat]'))) { closeLayer(true); setFilter(el.dataset.scat, true); return; }
    if ((el = t.closest('[data-spid]'))) {
      const id = el.dataset.spid;
      closeLayer(true);
      ui.filter = 'All'; renderChips(); renderGrid(false);
      scrollToEl($('#shop'));
      setTimeout(() => openQuick(id), reduceMotion ? 0 : 450);
      return;
    }

    if ((el = t.closest('.faq-q'))) {
      const item = el.closest('.faq-item'), open = !item.classList.contains('open');
      item.classList.toggle('open', open);
      el.setAttribute('aria-expanded', String(open));
      return;
    }

    if (t.closest('[data-copy-email]')) {
      const text = S().email || '';
      const done = (ok) => toast(ok ? 'Email address copied' : 'Copy was blocked — the address is shown on the page');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
      else done(false);
      return;
    }

    if (t.closest('[data-form-next]')) { nextStep(); return; }
    if (t.closest('[data-form-back]')) { goStep(Math.max(1, ui.step - 1), true); return; }
    if (t.closest('[data-clear-based]')) { ui.based = null; updateBased(); return; }
    if (t.closest('#waReset')) { resetForm(); return; }
    if (t.closest('#waCopy')) {
      const text = $('#waText').textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Message copied'), () => toast('Copy was blocked — select the text and copy it'));
      else toast('Copy was blocked — select the text and copy it');
      return;
    }
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'giftForm') return;
    e.preventDefault();
    if (ui.step < 3) nextStep(); else submitForm();
  });
  document.addEventListener('change', (e) => {

<script type="text/plain" id="lz-admin-css">
/* ==========================================================
   Lunara admin panel styles
   ========================================================== */
:root{
  --bg:#F4F1EC; --panel:#fff; --ink:#26221E; --muted:#625C54; --line:#E2DACE; --line-2:#EFE9DF;
  --gold:#876B3F; --gold-d:#6F5A34; --gold-l:#F3EBDA; --danger:#B3402D; --ok:#2C7A4B; --warn:#8F5C0A;
  --radius:12px; --shadow:0 2px 10px rgba(38,34,30,.06),0 10px 30px rgba(38,34,30,.05);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --top:56px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:var(--gold-d)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s;background:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:.86rem}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--gold-d)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold-d)}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{border-color:#E8C4BC;color:var(--danger);background:#fff}
.btn.danger:hover{background:#FBEDEA;border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{min-width:34px;padding:0 8px}

/* Gate (login) */
.gate{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#EFE4CF,var(--bg))}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:var(--shadow)}
.gate-card .logo{width:54px;height:54px;border-radius:50%;background:#0B0B0B;color:#C9AD7C;display:grid;place-items:center;font-size:1.7rem;margin-bottom:16px}
.gate-card h1{font-size:1.5rem;margin-bottom:6px}
.gate-card .lead{color:var(--muted);margin-bottom:20px}
.gate-card .btn{width:100%;margin-top:6px}
.gate-card .note{font-size:.84rem;color:var(--muted);margin-top:16px;background:var(--gold-l);padding:10px 12px;border-radius:10px}
.gate-card .linkbtn{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.86rem}
.gate-err{color:var(--danger);font-size:.88rem;min-height:1.3em;margin-top:6px}

/* Top bar */
.topbar{height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;background:#0B0B0B;color:#fff;position:sticky;top:0;z-index:50}
.tb-brand{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.tb-brand .logo{width:30px;height:30px;border-radius:50%;background:#fff;color:#8E7345;display:grid;place-items:center;font-size:1.05rem}
.tb-sub{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#C9AD7C;border:1px solid #4a4236;border-radius:99px;padding:2px 8px}
.status{font-size:.84rem;color:#CFC6B5;display:flex;align-items:center;gap:8px;margin-left:6px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:#7C7468}
.status.dirty::before{background:#E0A13A}
.status.clean::before{background:#52B77B}
.tb-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.topbar .btn.ghost{background:transparent;border-color:#4a4236;color:#fff}
.topbar .btn.ghost:hover{border-color:#fff}
.topbar .btn.ghost[aria-pressed="true"]{background:#fff;color:#0B0B0B}
.topbar .btn.primary{background:#C9AD7C;color:#0B0B0B}
.topbar .btn.primary:hover{background:#DDC393}
.topbar .btn:disabled{opacity:.35}

/* Shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 440px;height:calc(100vh - var(--top));height:calc(100dvh - var(--top))}
.side{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px 30px}
.side h4{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;color:var(--ink);font-weight:500}
.side button:hover{background:var(--line-2)}
.side button[aria-current="page"]{background:var(--gold-l);color:var(--gold-d);font-weight:700}
.side .ic{width:20px;text-align:center;opacity:.85}
.side .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#E0A13A}
.editor{overflow:auto;padding:26px clamp(16px,3vw,40px) 80px}
.editor>.page{max-width:820px;margin:0 auto}
.page>header{margin-bottom:22px}
.page>header h2{font-size:1.6rem;line-height:1.2}
.page>header p{color:var(--muted);margin-top:6px;max-width:640px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card>h3{font-size:1.02rem;margin-bottom:4px}
.card>.sub{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.card>h3+.fld,.card>h3+.row{margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row.three{grid-template-columns:repeat(3,1fr)}
.row>.fld{margin-bottom:0}
.row+.row,.row+.fld{margin-top:14px}

/* Fields */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.fld>label,.fld>.lbl{font-size:.84rem;font-weight:700;color:var(--ink)}
.fld input[type=text],.fld input[type=url],.fld input[type=email],.fld input[type=number],.fld input[type=password],.fld select,.fld textarea{width:100%;border:1px solid #CFC5B6;border-radius:9px;padding:9px 12px;background:#fff;min-height:40px}
.fld textarea{resize:vertical;min-height:84px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(135,107,63,.22)}
.hint{font-size:.82rem;color:var(--muted)}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--danger)} .hint.warn{color:var(--warn)}
.count{font-size:.78rem;color:var(--muted);text-align:right}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:.92rem;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:42px;height:24px;border-radius:99px;background:#C9C0B1;position:relative;flex:none;transition:background .2s}
.switch .track::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--gold)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2px solid var(--gold);outline-offset:2px}
.colorfld{display:flex;gap:8px;align-items:center}
.colorfld input[type=color]{width:44px;height:40px;padding:2px;border:1px solid #CFC5B6;border-radius:9px;background:#fff;cursor:pointer}
.colorfld input[type=text]{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace}

/* Images */
.imgfld{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.imgfld .thumb{width:120px;height:120px;border-radius:12px;background:var(--line-2) center/cover;border:1px dashed #CFC5B6;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center;position:relative;flex:none}
.imgfld .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgfld.drag .thumb,.gal-add.drag{border-color:var(--gold);background:var(--gold-l)}
.imgfld .ctl{display:flex;flex-direction:column;gap:8px;min-width:200px;flex:1}
.imgfld .btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--line-2);color:var(--muted)}
.tag.sample{background:#FBEFD6;color:#8A5E10}
.tag.mine{background:#DDF1E5;color:var(--ok)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.gal-item{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line-2)}
.gal-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gal-item .bar{display:flex;justify-content:space-between;padding:3px;background:#fff;border-top:1px solid var(--line)}
.gal-item .bar button{border:0;background:none;width:28px;height:28px;border-radius:7px;font-size:.95rem}
.gal-item .bar button:hover{background:var(--line-2)}
.gal-item .bar button:disabled{opacity:.3;cursor:default}
.gal-item .main{position:absolute;top:6px;left:6px;font-size:.68rem;font-weight:700;background:#0B0B0B;color:#fff;padding:2px 7px;border-radius:99px}
.gal-item .sample{position:absolute;top:6px;right:6px}
.gal-add{display:grid;place-items:center;gap:4px;text-align:center;border:2px dashed #CFC5B6;border-radius:10px;min-height:140px;background:none;color:var(--muted);padding:8px;font-size:.84rem}
.gal-add:hover{border-color:var(--gold);color:var(--gold-d)}

/* Lists */
.list{display:flex;flex-direction:column;gap:10px}
.list .empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed #CFC5B6;border-radius:10px;background:#fff}
.li{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li[open]{box-shadow:var(--shadow);border-color:#D4C7B0}
.li.off>summary .t{opacity:.55;text-decoration:line-through}
.li>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;min-height:56px}
.li>summary::-webkit-details-marker{display:none}
.li>summary::before{content:"▸";color:var(--muted);transition:transform .2s;flex:none}
.li[open]>summary::before{transform:rotate(90deg)}
.li .sthumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--line-2);flex:none}
.li .stx{flex:1;min-width:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li .s{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li .ctrls{display:flex;gap:2px;flex:none}
.li .ctrls button{border:0;background:none;min-width:32px;height:32px;border-radius:8px;font-size:.95rem}
.li .ctrls button:hover{background:var(--line-2)}
.li .ctrls button:disabled{opacity:.3;cursor:default}
.li .ctrls .del:hover{background:#FBEDEA;color:var(--danger)}
.li .body{padding:6px 16px 16px;border-top:1px solid var(--line-2)}
.li .body>.fld:first-child,.li .body>.row:first-child{margin-top:14px}
.list-tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.list-tools input{flex:1;min-width:160px;border:1px solid #CFC5B6;border-radius:9px;padding:8px 12px;min-height:38px}
.add-row{margin-top:4px}

/* Dashboard */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.check:first-of-type{border-top:0}
.check .mark{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:#FBEFD6;color:#8A5E10;margin-top:1px}
.check.ok .mark{background:#DDF1E5;color:var(--ok)}
.check .tx{flex:1;min-width:0}
.check .tx b{display:block}
.check .tx span{color:var(--muted);font-size:.88rem}
.check .go{flex:none}
.check label.manual{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
.check label.manual input{margin-top:5px;width:18px;height:18px;accent-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.84rem}
.callout{border-radius:12px;padding:14px 16px;margin-bottom:18px;border:1px solid var(--line);background:var(--gold-l);color:#4C3F25}
.callout.warn{background:#FBEFD6;border-color:#EBCF98;color:#6A470B}
.callout.ok{background:#E3F3EA;border-color:#B6DEC5;color:#1D5A37}
.callout b{display:block;margin-bottom:2px}
.callout .btn{margin-top:10px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:76px}
.quick button:hover{border-color:var(--gold)}
.quick button b{font-size:.95rem}
.quick button span{font-size:.82rem;color:var(--muted)}
ol.steps-list{margin:8px 0 0;padding-left:20px;color:var(--ink)}
ol.steps-list li{margin:6px 0}

/* Design */
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.preset{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:150px}
.preset:hover{border-color:var(--gold)}
.preset .sw{display:flex;gap:4px}
.preset .sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.cr-table{width:100%;border-collapse:collapse;font-size:.88rem}
.cr-table td,.cr-table th{padding:8px 6px;border-top:1px solid var(--line-2);text-align:left}
.cr-table th{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:0}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--danger);font-weight:700}
.font-sample{font-size:1.6rem;line-height:1.15;margin-top:4px}

/* Layout sections list */
.sec-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.sec-row .nm{font-weight:700}
.sec-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.sec-row input[type=text]{width:140px;border:1px solid #CFC5B6;border-radius:8px;padding:6px 10px;min-height:36px}
.sec-row.off .nm{opacity:.55}

/* Media library */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media-item{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.8rem}
.media-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line-2)}
.media-item .mi{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.media-item .mi b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-item .mi .btn{min-height:30px;padding:0 10px;font-size:.8rem}

/* Preview pane */
.preview{background:#E9E4DB;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.pv-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.pv-bar .pv-close{display:none;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:.84rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pv-stage{flex:1;position:relative;overflow:hidden;min-height:0}
.pv-stage iframe{border:0;background:#fff;position:absolute;left:0;top:0;transform-origin:0 0}
.pv-stage.mobile iframe{left:50%;box-shadow:0 10px 40px rgba(0,0,0,.25);border-radius:6px}

/* Toasts */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{pointer-events:auto;background:#0B0B0B;color:#fff;padding:10px 14px 10px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;font-size:.9rem;max-width:520px;animation:tin .3s ease both}
.toast button{border:0;background:none;color:#E0C58F;font-weight:700;text-decoration:underline;min-height:28px}
.toast.bad{background:#7A2418}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* Responsive */
@media (max-width:1320px){
  .shell{grid-template-columns:210px minmax(0,1fr)}
  .preview{position:fixed;left:0;right:0;top:var(--top);bottom:0;z-index:60;border-left:0;display:none}
  body.show-preview .preview{display:flex}
  .pv-bar .pv-close{display:inline-flex}
  body.show-preview{overflow:hidden}
}
@media (min-width:1321px){
  #previewToggle{display:none}
}
@media (max-width:900px){
  :root{--top:52px}
  .topbar{padding:0 10px;gap:8px}
  .tb-sub,.status{display:none}
  .tb-actions .btn{padding:0 10px}
  #undoBtn,.tb-actions a.btn{display:none}
  .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{display:flex;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:6px;gap:4px;white-space:nowrap}
  .side h4{display:none}
  .side button{width:auto;flex:none;padding:8px 12px}
  .row,.row.three{grid-template-columns:1fr}
  .li>summary{flex-wrap:wrap;row-gap:4px}
  .li .stx{flex:1 1 calc(100% - 100px)}
  .li .ctrls{flex:1 0 100%;justify-content:flex-end;margin-top:-4px;padding-left:24px}
  .sec-row{grid-template-columns:auto 1fr auto}
  .sec-row input[type=text]{grid-column:2/-1;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</script>

</div>
