<script type="text/plain" id="lz-admin-core">
/* ==========================================================
   Lunara admin — core: DOM helper, storage, images, form widgets
   ========================================================== */
(function () {
  'use strict';
  const LZ = window.LZ;
  const A = (window.LZA = {});
  A.open = new Set();      // ids of expanded list items (survives re-render)
  A.media = new Map();     // path → { blob, name, w, h, size, url? }  (uploaded photos)
  A.history = [];          // undo snapshots (JSON strings)
  A.data = null;           // the working copy of the site content
  A.persistent = true;     // false when IndexedDB is unavailable (private mode)
  A.publishedHash = null;

  /* ---------- tiny event bus ---------- */
  const bus = {};
  A.on = (n, fn) => { (bus[n] = bus[n] || []).push(fn); };
  A.fire = (n, a) => { (bus[n] || []).forEach((fn) => { try { fn(a); } catch (e) { console.error(e); } }); };

  /* ---------- DOM helper ---------- */
  function h(tag, props) {
    const el = document.createElement(tag);
    const p = props || {};
    for (const k in p) {
      const v = p[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'for') el.htmlFor = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden' || k === 'open') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (let i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).flat(Infinity).forEach((c) => {
        if (c == null || c === false) return;
        el.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    }
    return el;
  }
  A.h = h;
  A.$ = (s, r) => (r || document).querySelector(s);
  A.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  /* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
  const mem = { kv: new Map(), media: new Map() };
  let dbp = null;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        if (!window.indexedDB) return rej(new Error('no indexedDB'));
        const r = indexedDB.open('lunara-admin', 1);
        r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('kv'); db.createObjectStore('media'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function idb(store, mode, fn) {
    return openDB().then((db) => new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }
  A.db = {
    async get(s, k) { try { return await idb(s, 'readonly', (st) => st.get(k)); } catch (e) { A.persistent = false; return mem[s].get(k); } },
    async set(s, k, v) { try { await idb(s, 'readwrite', (st) => st.put(v, k)); } catch (e) { A.persistent = false; mem[s].set(k, v); } },
    async del(s, k) { try { await idb(s, 'readwrite', (st) => st.delete(k)); } catch (e) { A.persistent = false; mem[s].delete(k); } },
    async keys(s) { try { return await idb(s, 'readonly', (st) => st.getAllKeys()); } catch (e) { A.persistent = false; return Array.from(mem[s].keys()); } },
    async clear(s) { try { await idb(s, 'readwrite', (st) => st.clear()); } catch (e) { mem[s].clear(); } },
  };

  /* ---------- data helpers ---------- */
  A.fill = function fill(t, d) {
    for (const k in d) {
      if (t[k] === undefined) t[k] = LZ.clone(d[k]);
      else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) fill(t[k], d[k]);
    }
    return t;
  };
  A.normalize = function (d, baseline) {
    if (!d || typeof d !== 'object') d = {};
    A.fill(d, baseline || {});
    ['sections', 'collections', 'products', 'strip'].forEach((k) => { if (!Array.isArray(d[k])) d[k] = []; });
    LZ.SECTIONS.forEach((s) => { if (!d.sections.some((x) => x.key === s.key)) d.sections.push({ key: s.key, visible: true, nav: '' }); });
    d.products.forEach((p) => {
      if (!Array.isArray(p.images)) p.images = [];
      if (!Array.isArray(p.personalize)) p.personalize = [];
      if (p.priceFrom === undefined) p.priceFrom = true;
      if (p.visible === undefined) p.visible = true;
    });
    const add = (arr) => Array.isArray(arr) && arr.forEach((x) => { if (x && typeof x === 'object' && !x.id) x.id = LZ.uid(6); });
    add(d.collections); add(d.products); add(d.how && d.how.steps); add(d.reviews && d.reviews.items);
    add(d.instagram && d.instagram.images); add(d.faq && d.faq.items); add(d.footer && d.footer.links);
    return d;
  };
  A.hasChanges = () => LZ.hash(A.data) !== A.publishedHash;

  /* ---------- saving, preview refresh, undo ---------- */
  let saveT = null, pvT = null;
  A.touch = function () {
    A.fire('change');
    clearTimeout(saveT);
    saveT = setTimeout(() => A.db.set('kv', 'draft', A.data), 350);
    clearTimeout(pvT);
    pvT = setTimeout(() => A.preview.sendData(), 160);
  };
  A.flush = () => { clearTimeout(saveT); return A.db.set('kv', 'draft', A.data); };
  A.preview = { sendData() {}, sendMedia() {}, goto() {} }; // replaced by admin-app.js
  A.snap = function () {
    A.history.push(JSON.stringify(A.data));
    if (A.history.length > 30) A.history.shift();
    A.fire('history');
  };
  A.undo = function () {
    const s = A.history.pop();
    if (!s) return;
    A.data = JSON.parse(s);
    A.touch();
    A.fire('history');
    A.fire('reload');
  };

  A.toast = function (msg, opt) {
    opt = opt || {};
    const box = document.getElementById('toasts');
    const t = h('div', { class: 'toast' + (opt.bad ? ' bad' : '') }, h('span', null, msg),
      opt.action ? h('button', { type: 'button', onclick: () => { opt.action.fn(); t.remove(); } }, opt.action.label) : null);
    box.append(t);
    setTimeout(() => t.remove(), opt.action ? 7000 : opt.bad ? 5000 : 3000);
    while (box.children.length > 3) box.firstChild.remove();
  };

  /* ---------- layout helpers ---------- */
  A.panel = (title, desc, ...kids) => h('div', { class: 'page' }, h('header', null, h('h2', null, title), desc ? h('p', null, desc) : null), ...kids);
  A.card = (title, sub, ...kids) => h('section', { class: 'card' }, title ? h('h3', null, title) : null, sub ? h('p', { class: 'sub' }, sub) : null, ...kids);
  A.row = (...kids) => h('div', { class: 'row' }, ...kids);
  A.row3 = (...kids) => h('div', { class: 'row three' }, ...kids);

  /* ---------- form widgets ---------- */
  let uid = 0;
  const nid = () => 'fld' + ++uid;
  function fld(label, ctrl, hint, cls) {
    const id = ctrl.id || (ctrl.id = nid());
    return h('div', { class: 'fld' + (cls ? ' ' + cls : '') }, label ? h('label', { for: id }, label) : null, ctrl,
      hint ? (typeof hint === 'string' ? h('p', { class: 'hint' }, hint) : hint) : null);
  }
  A.fld = fld;
  A.group = (label, content, hint) => h('div', { class: 'fld' }, label ? h('span', { class: 'lbl' }, label) : null, content, hint ? h('p', { class: 'hint' }, hint) : null);

  A.text = function (o, k, label, opt) {
    opt = opt || {};
    const inp = h('input', { type: opt.type || 'text', value: o[k] == null ? '' : o[k], placeholder: opt.placeholder, maxlength: opt.maxlength, autocomplete: 'off' });
    let counter = null;
    if (opt.counter) counter = h('p', { class: 'hint' });
    const upd = () => { if (counter) counter.textContent = `${inp.value.length} characters — aim for ${opt.counter}.`; };
    inp.addEventListener('input', () => { o[k] = inp.value; upd(); if (opt.onInput) opt.onInput(inp.value, inp); A.touch(); });
    if (opt.onChange) inp.addEventListener('change', () => opt.onChange(inp.value, inp));
    upd();
    const f = fld(label, inp, opt.hint, opt.cls);
    if (counter) f.append(counter);
    if (opt.extra) f.append(opt.extra);
    return f;
  };
  A.area = function (o, k, label, opt) {
    opt = opt || {};
    const ta = h('textarea', { rows: opt.rows || 3, value: o[k] == null ? '' : o[k], placeholder: opt.placeholder });
    let counter = null;
    if (opt.counter) counter = h('p', { class: 'hint' });
    const upd = () => { if (counter) counter.textContent = `${ta.value.length} characters — aim for ${opt.counter}.`; };
    ta.addEventListener('input', () => { o[k] = ta.value; upd(); A.touch(); });
    upd();
    const f = fld(label, ta, opt.hint);
    if (counter) f.append(counter);
    return f;
  };
  A.num = function (o, k, label, opt) {
    opt = opt || {};
    const inp = h('input', { type: 'number', value: o[k] == null ? '' : o[k], min: opt.min, max: opt.max, step: opt.step || 1, inputmode: 'decimal' });
    inp.addEventListener('input', () => { o[k] = inp.value === '' ? 0 : Number(inp.value); A.touch(); });
    return fld(label, inp, opt.hint);
  };
  A.select = function (o, k, label, options, opt) {
    opt = opt || {};
    const list = options.map((x) => (typeof x === 'string' ? { value: x, label: x } : x));
    const sel = h('select', null,
      opt.blank != null ? h('option', { value: '' }, opt.blank) : null,
      list.map((x) => h('option', { value: x.value }, x.label)));
    if (o[k] && !list.some((x) => x.value === o[k]) && opt.blank == null) sel.append(h('option', { value: o[k] }, o[k] + ' (not in list)'));
    sel.value = o[k] == null ? '' : o[k];
    sel.addEventListener('change', () => { o[k] = sel.value; if (opt.onChange) opt.onChange(sel.value); A.touch(); });
    return fld(label, sel, opt.hint);
  };
  A.toggle = function (o, k, label, opt) {
    opt = opt || {};
    const on = o[k] === undefined ? opt.def !== false : !!o[k];
    const cb = h('input', { type: 'checkbox', checked: on });
    cb.addEventListener('change', () => { o[k] = cb.checked; if (opt.onChange) opt.onChange(cb.checked); A.touch(); });
    return h('div', { class: 'fld' }, h('label', { class: 'switch' }, cb, h('span', { class: 'track' }), h('span', null, label)), opt.hint ? h('p', { class: 'hint' }, opt.hint) : null);
  };
  A.color = function (o, k, label, opt) {
    opt = opt || {};
    const val = /^#[0-9a-f]{6}$/i.test(o[k]) ? o[k] : '#000000';
    const pick = h('input', { type: 'color', value: val, 'aria-label': label + ' colour picker' });
    const txt = h('input', { type: 'text', value: o[k] || val, maxlength: 7, 'aria-label': label + ' hex value', spellcheck: 'false' });
    pick.addEventListener('input', () => { o[k] = pick.value.toUpperCase(); txt.value = o[k]; if (opt.onChange) opt.onChange(); A.touch(); });
    txt.addEventListener('input', () => {
      let v = txt.value.trim();
      if (v && v[0] !== '#') v = '#' + v;
      if (/^#[0-9a-f]{6}$/i.test(v)) { o[k] = v.toUpperCase(); pick.value = o[k]; if (opt.onChange) opt.onChange(); A.touch(); }
    });
    const wrap = h('div', { class: 'colorfld' }, pick, txt);
    const f = h('div', { class: 'fld' }, h('span', { class: 'lbl' }, label), wrap, opt.hint ? h('p', { class: 'hint' }, opt.hint) : null);
    f.sync = () => { pick.value = /^#[0-9a-f]{6}$/i.test(o[k]) ? o[k] : '#000000'; txt.value = o[k]; };
    return f;
  };
  /* A textarea where each line (or paragraph) is one array entry */
  A.lines = function (o, k, label, opt) {
    opt = opt || {};
    const sep = opt.sep || '\n';
    const splitter = sep === '\n' ? /\n/ : /\n\s*\n/;
    if (!Array.isArray(o[k])) o[k] = [];
    const ta = h('textarea', { rows: opt.rows || 5, value: o[k].join(sep), placeholder: opt.placeholder });
    ta.addEventListener('input', () => { o[k] = ta.value.split(splitter); A.touch(); });
    ta.addEventListener('change', () => { o[k] = ta.value.split(splitter).map((s) => s.trim()).filter(Boolean); ta.value = o[k].join(sep); A.touch(); });
    return fld(label, ta, opt.hint);
  };

  /* ---------- images ---------- */
  A.isWeb = (p) => !!p && /^https?:\/\//i.test(p);
  A.isStock = (p) => !!p && (((A.data && A.data.settings && A.data.settings.stockPhotos) || []).indexOf(p) >= 0);
  A.isSample = (p) => !p || A.isWeb(p) || A.isStock(p); // stock/web photos are placeholders, not the shop's own work
  A.mediaURL = (p) => {
    const m = A.media.get(p);
    if (m) { if (!m.url) m.url = URL.createObjectURL(m.blob); return m.url; }
    return p;
  };
  async function processImage(file, max) {
    let bmp;
    try { bmp = await createImageBitmap(file); }
    catch (e) {
      bmp = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => rej(new Error('That image could not be read.'));
        im.src = URL.createObjectURL(file);
      });
    }
    const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
    const sc = Math.min(1, max / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * sc)), hh = Math.max(1, Math.round(h0 * sc));
    const c = document.createElement('canvas');
    c.width = w; c.height = hh;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, 0, 0, w, hh);
    let blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.8));
    let ext = 'webp';
    if (!blob || blob.type !== 'image/webp') {
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, hh);
      blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
      ext = 'jpg';
    }
    if (bmp.close) bmp.close();
    return { blob, ext, w, h: hh };
  }
  /* A photo's path is made from its own bytes, so the same photo always gets the
     same path. That keeps "published" and "draft" identical after the photos are
     embedded in the website file and read back in again. */
  const EXT = { 'image/webp': 'webp', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/avif': 'avif' };
  A.keyFor = async function (blob, ext) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    let a = 0x811c9dc5, b = 5381;
    for (let i = 0; i < buf.length; i++) { a ^= buf[i]; a = Math.imul(a, 16777619); b = (Math.imul(b, 33) ^ buf[i]) >>> 0; }
    const x = (n) => (n >>> 0).toString(16).padStart(8, '0');
    return `images/uploads/u-${x(a)}${x(b)}${buf.length.toString(36)}.${ext || EXT[blob.type] || 'webp'}`;
  };
  A.addImageFile = async function (file, opt) {
    opt = opt || {};
    if (!/^image\/(jpeg|png|webp|gif|avif|bmp)$/i.test(file.type)) throw new Error('Please choose a JPG, PNG or WebP photo.');
    if (file.size > 30 * 1024 * 1024) throw new Error('That photo is over 30 MB — please choose a smaller one.');
    const r = await processImage(file, opt.max || 1400);
    const path = await A.keyFor(r.blob, r.ext);
    if (!A.media.has(path)) {
      const rec = { blob: r.blob, name: file.name, w: r.w, h: r.h, size: r.blob.size, added: Date.now() };
      A.media.set(path, rec);
      await A.db.set('media', path, rec);
    }
    A.preview.sendMedia(path);
    return path;
  };
  const dataUrlToBlob = (u) => {
    const i = u.indexOf(',');
    const mime = (u.slice(0, i).match(/data:([^;,]+)/) || [])[1] || 'application/octet-stream';
    const bin = atob(u.slice(i + 1));
    const arr = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new Blob([arr], { type: mime });
  };
  A.dataUrlToBlob = dataUrlToBlob;
  /* Photos embedded in the website file arrive as data: links. Turn each one into a
     normal library photo (same path scheme as an upload) and swap the path into the data. */
  A.baseMedia = new Map();
  A.adoptEmbedded = async function (data) {
    const found = new Map();
    (function walk(o) {
      if (Array.isArray(o)) o.forEach((v, i) => { if (typeof v === 'string' && v.startsWith('data:image/')) found.set(v, null); else walk(v); });
      else if (o && typeof o === 'object') Object.keys(o).forEach((k) => { const v = o[k]; if (typeof v === 'string' && v.startsWith('data:image/')) found.set(v, null); else walk(v); });
    })(data);
    for (const uri of found.keys()) {
      try {
        const blob = dataUrlToBlob(uri);
        const path = await A.keyFor(blob);
        found.set(uri, path);
        if (!A.baseMedia.has(path)) {
          let w = 0, hh = 0;
          try { const bmp = await createImageBitmap(blob); w = bmp.width; hh = bmp.height; if (bmp.close) bmp.close(); } catch (e) { /* size unknown */ }
          A.baseMedia.set(path, { blob, name: path.split('/').pop(), w, h: hh, size: blob.size, added: 0, embedded: true });
        }
      } catch (e) { found.set(uri, ''); }
    }
    (function swap(o) {
      if (Array.isArray(o)) o.forEach((v, i) => { if (typeof v === 'string' && found.has(v)) o[i] = found.get(v); else swap(v); });
      else if (o && typeof o === 'object') Object.keys(o).forEach((k) => { const v = o[k]; if (typeof v === 'string' && found.has(v)) o[k] = found.get(v); else swap(v); });
    })(data);
    return data;
  };
  A.registerBaseMedia = async function () {
    for (const [path, rec] of A.baseMedia) {
      if (!A.media.has(path)) { A.media.set(path, rec); try { await A.db.set('media', path, rec); } catch (e) { /* ignore */ } }
    }
  };

  /* Photos that are web links (the stock photos that ship with the site, or links you pasted)
     can be copied into the website file, so it no longer depends on another site staying online.
     This runs in the visitor's own browser, which is why it works where a server could not. */
  A.webSlots = function (d) {
    d = d || A.data;
    const out = [];
    const one = (o, k, max) => { if (o && A.isWeb(o[k])) out.push({ o, k, url: o[k], max }); };
    if (d.hero) one(d.hero, 'image', 1600);
    if (d.story) { one(d.story, 'image1', 1400); one(d.story, 'image2', 1000); }
    (d.collections || []).forEach((c) => one(c, 'image', 1200));
    (d.products || []).forEach((p) => (p.images || []).forEach((_, i) => one(p.images, i, 1200)));
    if (d.instagram) (d.instagram.images || []).forEach((x) => one(x, 'src', 900));
    return out;
  };
  A.embedWeb = async function (opt) {
    opt = opt || {};
    const slots = A.webSlots();
    const max = new Map();
    slots.forEach((s) => max.set(s.url, Math.max(max.get(s.url) || 0, s.max)));
    const urls = Array.from(max.keys());
    const got = new Map();
    let n = 0, failed = 0, next = 0;
    const work = async (url) => {
      try {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 30000);
        let r;
        try { r = await fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer', signal: ctl.signal }); } finally { clearTimeout(t); }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        if (!/^image\//.test(blob.type)) throw new Error('not an image');
        got.set(url, await A.addImageFile(new File([blob], 'web-photo', { type: blob.type }), { max: max.get(url) }));
      } catch (e) { failed++; }
      n++;
      if (opt.onProgress) opt.onProgress(n, urls.length);
    };
    await Promise.all(Array.from({ length: Math.min(3, urls.length) }, async () => { while (next < urls.length) await work(urls[next++]); }));
    if (got.size) {
      A.snap();
      const stock = new Set(A.data.settings.stockPhotos || []);
      slots.forEach((sl) => { const p = got.get(sl.url); if (p) { sl.o[sl.k] = p; stock.add(p); } });
      A.data.settings.stockPhotos = Array.from(stock);
      A.touch();
    }
    return { total: urls.length, done: got.size, failed };
  };
  A.removeMedia = async function (path) {
    const m = A.media.get(path);
    if (m && m.url) { URL.revokeObjectURL(m.url); m.url = null; }
    A.media.delete(path);
    await A.db.del('media', path);
  };
  A.usedMedia = function () {
    const s = JSON.stringify(A.data);
    return new Set(Array.from(A.media.keys()).filter((p) => s.includes(p)));
  };
  const kb = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  A.kb = kb;

  function dropZone(el, onFiles) {
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag'));
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      el.classList.remove('drag');
      const fs = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
      if (fs.length) onFiles(fs);
    });
  }

  A.image = function (o, k, label, opt) {
    opt = opt || {};
    const thumb = h('div', { class: 'thumb' });
    const status = h('div');
    const file = h('input', { type: 'file', accept: 'image/*', hidden: true });
    const removeBtn = h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { A.snap(); o[k] = ''; paint(); A.touch(); } }, 'Remove');
    const wrap = h('div', { class: 'imgfld' });
    function paint() {
      const v = o[k];
      thumb.innerHTML = '';
      if (v) {
        const im = h('img', { src: A.mediaURL(v), alt: '' });
        im.addEventListener('error', () => { im.remove(); thumb.append(h('span', null, 'Preview unavailable')); });
        thumb.append(im);
      } else thumb.append(h('span', null, 'No photo yet'));
      status.innerHTML = '';
      status.append(h('span', { class: 'tag ' + (!v ? '' : A.isSample(v) ? 'sample' : 'mine') }, !v ? 'Empty' : A.isSample(v) ? (A.isWeb(v) ? 'Sample photo (web link)' : 'Sample photo (saved in file)') : 'Your photo'));
      removeBtn.hidden = !v;
    }
    async function handle(f) {
      thumb.innerHTML = '<span>Processing…</span>';
      try {
        const p = await A.addImageFile(f, { max: opt.max || 1400, base: opt.base ? opt.base() : f.name });
        o[k] = p;
        A.touch();
        A.toast('Photo added');
      } catch (e) { A.toast(e.message || 'Could not add that photo.', { bad: true }); }
      paint();
    }
    file.addEventListener('change', () => { if (file.files[0]) handle(file.files[0]); file.value = ''; });
    dropZone(wrap, (fs) => handle(fs[0]));
    const ctl = h('div', { class: 'ctl' }, status,
      h('div', { class: 'btns' },
        h('button', { class: 'btn gold sm', type: 'button', onclick: () => file.click() }, 'Upload photo'),
        h('button', { class: 'btn ghost sm', type: 'button', onclick: () => {
          const u = window.prompt('Paste an image link (https://…)', A.isSample(o[k]) ? o[k] || '' : '');
          if (u !== null) { o[k] = u.trim(); paint(); A.touch(); }
        } }, 'Use a link'),
        removeBtn),
      h('p', { class: 'hint' }, opt.hint || 'Drag a photo here, or upload one. It is resized automatically.'),
      opt.alt ? A.text(opt.alt[0], opt.alt[1], 'Describe the photo (for screen readers)', { cls: '' }) : null,
      file);
    wrap.append(thumb, ctl);
    paint();
    return A.group(label, wrap);
  };

  A.gallery = function (o, k, label, opt) {
    opt = opt || {};
    if (!Array.isArray(o[k])) o[k] = [];
    const grid = h('div', { class: 'gallery' });
    const file = h('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });
    const addBtn = h('button', { class: 'gal-add', type: 'button', onclick: () => file.click() }, h('span', null, '＋ Add photos'), h('small', null, 'or drop them here'));
    function paint() {
      grid.innerHTML = '';
      o[k].forEach((p, i) => {
        const im = h('img', { src: A.mediaURL(p), alt: `Photo ${i + 1}` });
        im.addEventListener('error', () => { im.style.visibility = 'hidden'; });
        grid.append(h('div', { class: 'gal-item' },
          i === 0 ? h('span', { class: 'main' }, 'Main') : null,
          A.isSample(p) ? h('span', { class: 'tag sample sample' }, 'Sample') : null,
          im,
          h('div', { class: 'bar' },
            h('button', { type: 'button', 'aria-label': 'Move earlier', disabled: i === 0, onclick: () => { [o[k][i - 1], o[k][i]] = [o[k][i], o[k][i - 1]]; paint(); A.touch(); } }, '◀'),
            h('button', { type: 'button', 'aria-label': 'Remove photo', onclick: () => { A.snap(); o[k].splice(i, 1); paint(); A.touch(); } }, '✕'),
            h('button', { type: 'button', 'aria-label': 'Move later', disabled: i === o[k].length - 1, onclick: () => { [o[k][i + 1], o[k][i]] = [o[k][i], o[k][i + 1]]; paint(); A.touch(); } }, '▶'))));
      });
      grid.append(addBtn);
    }
    async function handle(fs) {
      let n = 0;
      for (const f of fs) {
        try { const p = await A.addImageFile(f, { max: opt.max || 1400, base: opt.base ? opt.base() : f.name }); o[k].push(p); n++; }
        catch (e) { A.toast(f.name + ': ' + (e.message || 'could not be added'), { bad: true }); }
      }
      paint();
      if (n) { A.touch(); A.toast(n + (n === 1 ? ' photo added' : ' photos added')); }
    }
    file.addEventListener('change', () => { handle(Array.from(file.files)); file.value = ''; });
    dropZone(addBtn, handle);
    paint();
    const links = h('button', { class: 'btn ghost sm', type: 'button', style: { marginTop: '8px' }, onclick: () => {
      const u = window.prompt('Paste an image link (https://…)');
      if (u && u.trim()) { o[k].push(u.trim()); paint(); A.touch(); }
    } }, 'Add a photo by link');
    return A.group(label, h('div', null, grid, file, links), opt.hint || 'The first photo is the main one shown on the product card. Extra photos appear in the quick-view gallery.');
  };

  /* ---------- expandable, re-orderable lists ---------- */
  A.list = function (cfg) {
    const box = h('div', { class: 'list' });
    const wrap = h('div');
    let searchBox = null;
    if (cfg.searchText) {
      searchBox = h('input', { type: 'search', placeholder: 'Search ' + (cfg.noun || 'items') + 's…', 'aria-label': 'Search', oninput: () => filter() });
      wrap.append(h('div', { class: 'list-tools' }, searchBox));
    }
    function filter() {
      if (!searchBox) return;
      const q = searchBox.value.trim().toLowerCase();
      cfg.arr.forEach((it, i) => { const el = box.children[i]; if (el && el.tagName === 'DETAILS') el.hidden = !!q && !cfg.searchText(it).toLowerCase().includes(q); });
    }
    function paint() {
      box.innerHTML = '';
      if (!cfg.arr.length) box.append(h('p', { class: 'empty' }, cfg.empty || 'Nothing here yet.'));
      cfg.arr.forEach((it, i) => box.append(item(it, i)));
      filter();
    }
    function move(i, dir) {
      const j = i + dir;
      if (j < 0 || j >= cfg.arr.length) return;
      A.snap();
      [cfg.arr[i], cfg.arr[j]] = [cfg.arr[j], cfg.arr[i]];
      paint();
      A.touch();
    }
    function item(it, i) {
      const d = h('details', { class: 'li' + (cfg.isOff && cfg.isOff(it) ? ' off' : '') });
      d.open = A.open.has(it.id);
      d.addEventListener('toggle', () => { if (d.open) A.open.add(it.id); else A.open.delete(it.id); });
      const t = h('span', { class: 't' }, cfg.title(it) || '(untitled)');
      const s = h('span', { class: 's' }, cfg.sub ? cfg.sub(it) : '');
      const th = cfg.thumb ? h('img', { class: 'sthumb', src: A.mediaURL(cfg.thumb(it) || ''), alt: '' }) : null;
      if (th) th.addEventListener('error', () => { th.style.visibility = 'hidden'; });
      const stop = (fn) => (e) => { e.preventDefault(); e.stopPropagation(); fn(); };
      const ctrls = h('span', { class: 'ctrls' },
        h('button', { type: 'button', 'aria-label': 'Move up', disabled: i === 0, onclick: stop(() => move(i, -1)) }, '↑'),
        h('button', { type: 'button', 'aria-label': 'Move down', disabled: i === cfg.arr.length - 1, onclick: stop(() => move(i, 1)) }, '↓'),
        cfg.dup === false ? null : h('button', { type: 'button', 'aria-label': 'Duplicate', onclick: stop(() => {
          A.snap();
          const c = LZ.clone(it);
          c.id = LZ.uid(6);
          if (typeof c.name === 'string') c.name += ' (copy)';
          cfg.arr.splice(i + 1, 0, c);
          A.open.add(c.id);
          paint();
          A.touch();
        }) }, '⧉'),
        h('button', { class: 'del', type: 'button', 'aria-label': 'Delete', onclick: stop(() => {
          A.snap();
          cfg.arr.splice(i, 1);
          if (cfg.onDelete) cfg.onDelete(it);
          paint();
          A.touch();
          A.toast('Deleted “' + (cfg.title(it) || 'item') + '”', { action: { label: 'Undo', fn: () => A.undo() } });
        }) }, '🗑'));
      const sum = h('summary', null, th, h('span', { class: 'stx' }, t, s), ctrls);
      const body = h('div', { class: 'body' }, cfg.fields(it, { repaint: paint, index: i }));
      body.addEventListener('input', () => {
        t.textContent = cfg.title(it) || '(untitled)';
        if (cfg.sub) s.textContent = cfg.sub(it);
        if (th && cfg.thumb) th.src = A.mediaURL(cfg.thumb(it) || '');
        d.classList.toggle('off', !!(cfg.isOff && cfg.isOff(it)));
      });
      body.addEventListener('change', () => {
        if (cfg.sub) s.textContent = cfg.sub(it);
        if (th && cfg.thumb) { th.style.visibility = ''; th.src = A.mediaURL(cfg.thumb(it) || ''); }
        d.classList.toggle('off', !!(cfg.isOff && cfg.isOff(it)));
      });
      d.append(sum, body);
      return d;
    }
    wrap.append(box,
      h('div', { class: 'add-row' }, h('button', { class: 'btn gold', type: 'button', onclick: () => {
        A.snap();
        const n = cfg.make();
        if (!n.id) n.id = LZ.uid(6);
        cfg.arr.push(n);
        A.open.add(n.id);
        paint();
        A.touch();
        const el = box.lastElementChild;
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } }, '＋ ' + (cfg.addLabel || 'Add'))));
    paint();
    return wrap;
  };
})();

</script>
<script type="text/plain" id="lz-admin-sections">
/* ==========================================================
   Lunara admin — one editor per area of the website
   ========================================================== */
(function () {
  'use strict';
  const LZ = window.LZ, A = window.LZA, h = A.h;
  const S = {}; // section renderers: id → () => element
  A.sections = S;

  A.NAV = [
    { group: 'Overview', items: [{ id: 'dashboard', label: 'Dashboard', ic: '⌂' }] },
    { group: 'Content', items: [
      { id: 'products', label: 'Products', ic: '◫', site: 'shop' },
      { id: 'collections', label: 'Collections', ic: '▦', site: 'collections' },
      { id: 'hero', label: 'Homepage hero', ic: '★', site: 'hero' },
      { id: 'story', label: 'Our story', ic: '✎', site: 'story' },
      { id: 'how', label: 'How it works', ic: '①', site: 'how' },
      { id: 'custom', label: 'Custom gift form', ic: '✉', site: 'custom' },
      { id: 'reviews', label: 'Reviews', ic: '❝', site: 'reviews' },
      { id: 'instagram', label: 'Instagram', ic: '◎', site: 'instagram' },
      { id: 'faq', label: 'FAQ', ic: '？', site: 'faq' },
      { id: 'contact', label: 'Contact & footer', ic: '☎', site: 'contact' },
    ] },
    { group: 'Site', items: [
      { id: 'settings', label: 'Brand & contact', ic: '☾', site: 'hero' },
      { id: 'layout', label: 'Page layout', ic: '☰' },
      { id: 'design', label: 'Design', ic: '◐' },
      { id: 'media', label: 'Photo library', ic: '▣' },
    ] },
    { group: 'Publish', items: [{ id: 'publish', label: 'Publish & backup', ic: '⇪' }] },
  ];

  const D = () => A.data;
  const secOptions = LZ.SECTIONS.filter((s) => s.key !== 'strip').map((s) => ({ value: s.key, label: s.label }));
  const catName = (id) => ((D().collections.find((c) => c.id === id)) || {}).name || '';
  const secObj = (key) => D().sections.find((s) => s.key === key);
  const head3 = (o, ids) => A.row3(...ids.map(([k, l]) => A.text(o, k, l)));

  /* ---------------- Dashboard ---------------- */
  S.dashboard = function () {
    const d = D(), s = d.settings;
    const sampleProducts = d.products.filter((p) => p.visible !== false && (!p.images.length || p.images.some(A.isSample))).length;
    const otherSamples = [d.hero.image, d.story.image1, d.story.image2].concat(d.collections.filter((c) => c.visible !== false).map((c) => c.image)).filter((x) => A.isSample(x)).length;
    const auto = [
      { ok: LZ.waConfigured(s), title: 'Add your WhatsApp number', text: 'Until then, every “Customize” and “Send enquiry” button opens WhatsApp without a number.', go: 'settings' },
      { ok: LZ.emailReal(s.email), title: 'Add your contact email', text: 'Optional, but it adds an email card to the Contact section and the footer.', go: 'settings' },
      { ok: sampleProducts === 0, title: sampleProducts ? `Upload your own photos for ${sampleProducts} product${sampleProducts === 1 ? '' : 's'}` : 'Product photos are all yours', text: 'Products still using sample web photos show stock images, not your work.', go: 'products' },
      { ok: otherSamples === 0, title: otherSamples ? `Replace ${otherSamples} sample photo${otherSamples === 1 ? '' : 's'} on the hero, story and collections` : 'Hero, story and collection photos are all yours', text: 'These are the first photos visitors see.', go: 'hero' },
    ];
    const webN = new Set(A.webSlots().map((x) => x.url)).size;
    if (webN) auto.push({ ok: false, title: `${webN} photo${webN === 1 ? ' loads' : 's load'} from other websites`, text: 'Save them into your website file so it works on its own — Photo library → “Save web photos into this file”.', go: 'media' });
    const manual = [
      ['prices', 'I have replaced the sample product names, prices and descriptions with my real ones.', 'products'],
      ['faq', 'I have checked that the FAQ, “How it works” and shop note describe how I really work.', 'faq'],
      ['lead', 'I have set my delivery lead time (Brand & contact → Earliest delivery date).', 'settings'],
    ];
    const row = (c) => h('div', { class: 'check' + (c.ok ? ' ok' : '') },
      h('span', { class: 'mark' }, c.ok ? '✓' : '!'),
      h('div', { class: 'tx' }, h('b', null, c.title), h('span', null, c.text)),
      c.ok ? null : h('button', { class: 'btn ghost sm go', type: 'button', onclick: () => A.go(c.go) }, 'Fix'));
    const manRow = (m) => {
      const cb = h('input', { type: 'checkbox', checked: !!A.checks[m[0]] });
      cb.addEventListener('change', () => { A.checks[m[0]] = cb.checked; A.db.set('kv', 'checks', A.checks); });
      return h('div', { class: 'check' + (A.checks[m[0]] ? ' ok' : '') }, h('label', { class: 'manual' }, cb, h('span', { class: 'tx' }, h('b', null, m[1]))),
        h('button', { class: 'btn ghost sm go', type: 'button', onclick: () => A.go(m[2]) }, 'Open'));
    };
    const dirty = A.hasChanges();
    return A.panel('Dashboard', 'Everything you change here is saved in this browser straight away. Nothing goes live until you download your updated website file and upload it to your host.',
      !A.persistent ? h('div', { class: 'callout warn' }, h('b', null, 'Your browser is not saving drafts'), 'Private browsing or blocked site data stops edits being kept between visits. Use “Download backup” on the Publish page often.') : null,
      h('div', { class: 'callout ' + (dirty ? 'warn' : 'ok') }, h('b', null, dirty ? 'You have changes that are not published yet' : 'No changes since your last download'),
        dirty ? 'Download your updated website file and upload it to your host to make them live.' : 'Make an edit and it will show up here.',
        h('div', null, h('button', { class: 'btn primary sm', type: 'button', onclick: () => A.go('publish') }, 'Go to Publish'))),
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('b', null, d.products.filter((p) => p.visible !== false).length), h('span', null, 'Products on show')),
        h('div', { class: 'stat' }, h('b', null, d.collections.filter((c) => c.visible !== false).length), h('span', null, 'Collections')),
        h('div', { class: 'stat' }, h('b', null, A.media.size), h('span', null, 'Photos uploaded')),
        h('div', { class: 'stat' }, h('b', null, d.sections.filter((x) => x.visible).length), h('span', null, 'Sections visible'))),
      A.card('Before you launch', 'A checklist of what still looks like sample content.',
        auto.map(row), manual.map(manRow)),
      A.card('Jump to', null, h('div', { class: 'quick' },
        [['products', 'Products', 'Add, edit and photograph your creations'], ['hero', 'Homepage hero', 'Headline and main photo'], ['design', 'Design', 'Colours, fonts and corners'], ['layout', 'Page layout', 'Show, hide and reorder sections'], ['media', 'Photo library', 'Everything you have uploaded'], ['publish', 'Publish & backup', 'Go live, back up, restore']]
          .map((q) => h('button', { type: 'button', onclick: () => A.go(q[0]) }, h('b', null, q[1]), h('span', null, q[2]))))));
  };

  /* ---------------- Brand & contact ---------------- */
  S.settings = function () {
    const s = D().settings;
    const waStatus = h('p', { class: 'hint' });
    const waUpdate = () => {
      if (LZ.waConfigured(s)) { waStatus.className = 'hint ok'; waStatus.textContent = '✓ Customers will chat with +' + LZ.waDigits(s) + '.'; }
      else { waStatus.className = 'hint warn'; waStatus.textContent = 'Not set yet — WhatsApp buttons open without a contact until you add your number.'; }
    };
    const waTest = h('button', { class: 'btn ghost sm', type: 'button', style: { marginTop: '6px', alignSelf: 'flex-start' }, onclick: () => window.open(LZ.waURL(s, 'Test message from my website admin'), '_blank') }, 'Test the WhatsApp link');
    const wa = A.text(s, 'whatsapp', 'WhatsApp number', {
      placeholder: 'e.g. 919876543210',
      hint: 'Country code first, digits only. A 10-digit Indian mobile number automatically gets 91 added.',
      onInput: waUpdate,
      onChange: (v, inp) => {
        let dg = v.replace(/\D/g, '');
        if (dg.length === 10 && /^[6-9]/.test(dg)) dg = '91' + dg;

    (d.products || []).forEach((p) => { if ((p.images || []).indexOf(path) >= 0) add(p.name); });
    if (d.instagram && (d.instagram.images || []).indexOf(path) >= 0) add('Instagram grid');

      if (r.failed) { webBtn.disabled = false; webMsg.className = 'hint bad'; webMsg.textContent = `${r.failed} could not be saved (you may be offline, or that photo site does not allow copying). They stay as web links — you can try again or upload your own.`; }

    return A.panel('Publish & backup', 'Your whole website is one file, index.html. Publishing means downloading the updated file and uploading it to your host.',
      h('div', { class: 'callout ' + (dirty ? 'warn' : 'ok') }, h('b', null, dirty ? 'You have changes that are not in a downloaded file yet' : 'No changes since your last download'), dirty ? 'Download the updated website file below and upload it to go live.' : 'You are up to date.'),
      A.card('1 · Download your updated website', null,
        h('button', { class: 'btn primary', type: 'button', onclick: () => A.actions.downloadSite() }, '⬇ Download index.html'),
        webN ? h('div', { class: 'fld', style: { marginTop: '14px' } }, h('label', { class: 'switch' }, saveWeb, h('span', { class: 'track' }), h('span', null, `Save the ${webN} web photo${webN === 1 ? '' : 's'} inside the file`)),
          h('p', { class: 'hint' }, 'Recommended. Copies the photos into the file so the website still works if the original photo site changes or goes offline.')) : null,
        h('div', { class: 'fld', style: { marginTop: '14px' } }, h('label', { class: 'switch' }, keep, h('span', { class: 'track' }), h('span', null, 'Keep this admin panel inside the file')),
          h('p', { class: 'hint' }, 'On: you can keep editing later by opening your website address with #admin on the end. Off: a slightly smaller, public-only file with no editor — keep a backup first.')),
        h('ol', { class: 'steps-list' },
          h('li', null, 'Save the file with the name ', h('b', null, 'index.html'), '.'),
          h('li', null, 'Upload it to your website host, replacing the old index.html. Nothing else needs uploading.'),
          h('li', null, 'Reload your website (press Ctrl+F5 / Cmd+Shift+R if you still see the old one).')),
        h('p', { class: 'hint', style: { marginTop: '10px' } }, (used.size ? `Your own photos add about ${A.kb(Math.round(bytes * 1.37))} to the file (${used.size} photo${used.size === 1 ? '' : 's'}). ` + (bytes * 1.37 > 6 * 1048576 ? 'That is large — fewer or smaller photos will make the website load faster.' : 'That is a comfortable size.') : 'No photos of your own are in the file yet — the sample photos load from the web. Add yours under Products → Photos.'))),
      A.card('2 · Backup & restore', 'A backup contains your content and photos in one file. Use it to move to another computer or browser.',
        h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap' } },

          h('button', { class: 'btn ghost', type: 'button', onclick: () => imp.click() }, 'Restore from backup…'), imp)),
      A.card('3 · Start again', 'Discards everything you changed in this browser and goes back to the content of the website file you opened.',
        h('button', { class: 'btn danger', type: 'button', onclick: () => A.actions.discardDraft() }, 'Discard my draft')));
  };
})();

<script type="text/plain" id="lz-admin-app">
/* ==========================================================
   Lunara admin — shell, live preview, publish & backup
   ========================================================== */
(function () {
  'use strict';
  const LZ = window.LZ, A = window.LZA, h = A.h, $ = A.$;
  const baseline = () => window.LUNARA_DATA || {};
  const SELF = window.LZ_SELF || location.href.split('#')[0].split('?')[0];
  A.checks = {};
  A.pubOpts = { keepAdmin: true };
  A.section = 'dashboard';

  /* ---------------- live preview ---------------- */
  const frame = () => $('#pvFrame');
  let frameReady = false, popup = null, device = 'mobile';
  const post = (w, msg) => { try { if (w) w.postMessage(msg, '*'); } catch (e) { /* ignore */ } };
  function mediaBulk() { const o = {}; A.media.forEach((m, p) => { o[p] = m.blob; }); return o; }
  function sendAll(w) {
    post(w, { type: 'lunara-media-bulk', media: mediaBulk() });
    post(w, { type: 'lunara-data', data: A.data });
    const nav = findNav(A.section);
    if (nav && nav.site) setTimeout(() => post(w, { type: 'lunara-goto', key: nav.site }), 150);
  }
  A.preview.sendData = () => {
    if (frameReady) post(frame().contentWindow, { type: 'lunara-data', data: A.data });
    if (popup && !popup.closed) post(popup, { type: 'lunara-data', data: A.data });
  };
  A.preview.sendMedia = (path) => {
    const m = A.media.get(path);
    if (!m) return;
    if (frameReady) post(frame().contentWindow, { type: 'lunara-media', path, blob: m.blob });
    if (popup && !popup.closed) post(popup, { type: 'lunara-media', path, blob: m.blob });
  };
  A.preview.goto = (key) => {
    if (frameReady) post(frame().contentWindow, { type: 'lunara-goto', key });
    if (popup && !popup.closed) post(popup, { type: 'lunara-goto', key });
  };
  A.preview.resync = () => {
    if (frameReady) sendAll(frame().contentWindow);

  window.addEventListener('message', (ev) => {

  });
  function layoutPreview() {
    const stage = $('#pvStage'), f = frame();
    if (!stage || !f) return;
    const W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H) return;

      const w = Math.min(390, W - 16);

    } else {
      const sc = W / 1280;

    }
  }
  function wirePreview() {
    $$btn('[data-dev]').forEach((b) => b.addEventListener('click', () => {
      device = b.dataset.dev;
      $$btn('[data-dev]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      layoutPreview();
    }));
    $('#pvNewTab').addEventListener('click', () => { popup = window.open(SELF + '?embed=1', '_blank'); });
    $('#previewToggle').addEventListener('click', () => togglePreview());
    $('#pvClose').addEventListener('click', () => togglePreview(false));
    if (window.ResizeObserver) new ResizeObserver(layoutPreview).observe($('#pvStage'));
    window.addEventListener('resize', layoutPreview);
    frame().src = SELF + '?embed=1';
    layoutPreview();
  }
  function $$btn(sel) { return A.$$(sel); }
  function togglePreview(force) {
    const on = force === undefined ? !document.body.classList.contains('show-preview') : force;
    document.body.classList.toggle('show-preview', on);
    $('#previewToggle').setAttribute('aria-pressed', String(on));
    setTimeout(layoutPreview, 30);
  }

  /* ---------------- shell: sidebar, routing, status ---------------- */
  function findNav(id) { for (const g of A.NAV) { const it = g.items.find((i) => i.id === id); if (it) return it; } return null; }
  function renderSide() {
    const side = $('#side');
    side.innerHTML = '';
    A.NAV.forEach((g) => {
      side.append(h('h4', null, g.group));
      g.items.forEach((it) => side.append(h('button', { type: 'button', 'data-id': it.id, 'aria-current': it.id === A.section ? 'page' : null, onclick: () => A.go(it.id) },
        h('span', { class: 'ic', 'aria-hidden': 'true' }, it.ic), it.label, it.id === 'publish' && A.hasChanges() ? h('span', { class: 'dot', title: 'Unpublished changes' }) : null)));
    });
  }
  A.go = function (id, keepScroll) {
    if (!A.sections[id]) id = 'dashboard';
    A.section = id;
    const ed = $('#editor');
    const y = keepScroll ? ed.scrollTop : 0;
    ed.innerHTML = '';
    try { ed.append(A.sections[id]()); }
    catch (e) { console.error(e); ed.append(h('div', { class: 'page' }, h('div', { class: 'callout warn' }, h('b', null, 'This page could not be shown'), String(e && e.message)))); }
    ed.scrollTop = y;
    try { window.parent.postMessage({ type: 'lz-hash', hash: '#admin/' + id }, '*'); } catch (e) { /* ignore */ }
    renderSide();
    const nav = findNav(id);
    if (nav && nav.site) A.preview.goto(nav.site);
    if (window.innerWidth <= 1320) togglePreview(false);
  };
  A.on('reload', () => A.go(A.section, true));
  let stT = null;
  function updateStatus() {
    const dirty = A.hasChanges();
    const st = $('#status');
    st.textContent = dirty ? 'Unpublished changes' : 'Up to date with last download';
    st.className = 'status ' + (dirty ? 'dirty' : 'clean');
    const dot = $('#side [data-id="publish"] .dot');
    if (dirty && !dot) renderSide(); else if (!dirty && dot) dot.remove();
  }
  A.on('change', () => { clearTimeout(stT); stT = setTimeout(updateStatus, 250); });
  A.on('history', () => { $('#undoBtn').disabled = !A.history.length; });

  /* ---------------- publish, backup, password ---------------- */
  const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  const blobToDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
  function dataUrlToBlob(u) {
    const i = u.indexOf(',');
    const mime = (u.slice(0, i).match(/data:([^;,]+)/) || [])[1] || 'application/octet-stream';
    const bin = atob(u.slice(i + 1));
    const arr = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new Blob([arr], { type: mime });
  }
  function clearMediaMemory() { A.media.forEach((m) => { if (m.url) { URL.revokeObjectURL(m.url); m.url = null; } }); A.media.clear(); }

  A.actions = {
    async downloadSite() {
      const web = new Set(A.webSlots().map((x) => x.url)).size;
      if (web && A.pubOpts.saveWeb !== false) {
        A.toast(`Saving ${web} web photo${web === 1 ? '' : 's'} into the file…`);
        const r = await A.embedWeb();
        if (r.failed && !window.confirm(`${r.failed} photo${r.failed === 1 ? '' : 's'} could not be saved into the file (you may be offline, or the photo site does not allow copying). ${r.failed === 1 ? 'It' : 'They'} will stay as web links and need the internet to show.\n\nDownload the website file anyway?`)) return;
      }
      const d = A.data, issues = [];
      if (!LZ.waConfigured(d.settings)) issues.push('Your WhatsApp number is not set.');
      const samples = d.products.filter((p) => p.visible !== false && (!p.images.length || p.images.some(A.isSample))).length;
      if (samples) issues.push(`${samples} product(s) still use sample photos.`);
      if (issues.length && !window.confirm('Before you publish:\n\n• ' + issues.join('\n• ') + '\n\nDownload the website file anyway?')) return;
      await A.flush();
      let src;
      try { src = await getSrc(); } catch (e) { A.toast('Could not read the website file. Open the admin from the website file itself (index.html#admin).', { bad: true }); return; }
      const out = await buildSite(src, d, A.pubOpts.keepAdmin !== false);
      download(new Blob([out], { type: 'text/html' }), 'index.html');
      A.publishedHash = LZ.hash(A.data);
      await A.db.set('kv', 'publishedHash', A.publishedHash);
      await A.db.set('kv', 'baseHash', A.publishedHash);
      updateStatus();
      A.toast(`Website file downloaded (${A.kb(out.length)}) — save it as index.html and upload it to your host`);
      if (A.section === 'publish') A.go('publish', true);
    },
    async exportBackup() {
      await A.flush();
      const media = {};
      for (const [p, m] of A.media) media[p] = { name: m.name, w: m.w, h: m.h, size: m.size, added: m.added, dataUrl: await blobToDataUrl(m.blob) };
      download(new Blob([JSON.stringify({ lunaraBackup: 1, savedAt: new Date().toISOString(), data: A.data, media })], { type: 'application/json' }), `lunara-backup-${stamp()}.json`);
      A.toast('Backup downloaded');
    },
    async importBackup(file) {
      let obj;
      try { obj = JSON.parse(await file.text()); } catch (e) { A.toast('That file is not a valid backup.', { bad: true }); return; }
      if (!obj || obj.lunaraBackup !== 1 || !obj.data || typeof obj.data !== 'object') { A.toast('That file is not a Lunara backup.', { bad: true }); return; }
      if (!window.confirm('Replace everything in this editor with the backup? Your current draft will be overwritten.')) return;
      clearMediaMemory();
      await A.db.clear('media');
      for (const p of Object.keys(obj.media || {})) {
        const m = obj.media[p];
        if (!/^images\/uploads\/[\w.\-]+$/.test(p) || typeof m.dataUrl !== 'string') continue;
        const rec = { blob: dataUrlToBlob(m.dataUrl), name: m.name || p, w: m.w || 0, h: m.h || 0, size: m.size || 0, added: m.added || Date.now() };
        A.media.set(p, rec);
        await A.db.set('media', p, rec);
      }
      A.data = A.normalize(obj.data, LZ.clone(baseline()));

      await A.flush();
      A.fire('history'); A.touch();
      A.preview.resync();
      A.go(A.section);
      A.toast('Backup restored');
    },
    async discardDraft() {
      if (!window.confirm('Discard everything you changed in this browser and go back to the content of this website file? Photos you added since then will be deleted.')) return;
      clearMediaMemory();
      await A.db.clear('media');
      await A.registerBaseMedia();
      A.data = A.normalize(LZ.clone(baseline()), LZ.clone(baseline()));
      A.publishedHash = LZ.hash(A.data);
      await A.db.set('kv', 'publishedHash', A.publishedHash);
      await A.db.set('kv', 'baseHash', A.publishedHash);
      A.history = [];
      await A.flush();
      A.fire('history'); updateStatus();
      A.preview.resync();
      A.go('dashboard');
      A.toast('Draft discarded');
    },
  };

  /* ---------------- building the downloaded website file ---------------- */
  // The outer page keeps a pristine copy of its own source; ask it for that copy.
  function getSrc() {
    return new Promise((res, rej) => {
      const t = setTimeout(() => { window.removeEventListener('message', on); rej(new Error('timeout')); }, 15000);

  async function buildSite(src, data, keepAdmin) {
    const d = LZ.clone(data);
    // 1. swap library paths for the photos themselves (data: links) so the file stands alone
    const uris = {};
    for (const p of A.usedMedia()) uris[p] = await blobToDataUrl(A.media.get(p).blob);
    (function swap(o) {
      if (Array.isArray(o)) o.forEach((v, i) => { if (typeof v === 'string' && uris[v]) o[i] = uris[v]; else swap(v); });

    const i0 = src.indexOf('<script id="js-data">');
    const i1 = src.indexOf('</' + 'script>', i0);
    if (i0 < 0 || i1 < 0) throw new Error('data block not found');
    let out = src.slice(0, i0) + block + src.slice(i1 + 9);
    // 2. keep the page title / description / link-preview text in step with Brand & contact
    const s = d.settings || {};
    const title = s.siteTitle || ((s.brandName || '') + ' ' + (s.brandSub || '')).trim();
    if (title) {
      out = out.replace(/<title>[\s\S]*?<\/title>/, () => `<title>${et(title)}</title>`);
      out = out.replace(/(<meta property="og:title" content=")[^"]*(")/, (m, a, b) => a + ea(title) + b);
    }
    if (s.metaDescription) {
      out = out.replace(/(<meta name="description" content=")[^"]*(")/, (m, a, b) => a + ea(s.metaDescription) + b);
      out = out.replace(/(<meta property="og:description" content=")[^"]*(")/, (m, a, b) => a + ea(s.metaDescription) + b);
    }
    // 3. optionally drop the admin panel
    if (!keepAdmin) out = out.replace(/<script type="text\/plain" id="lz-admin-[a-z]+">[\s\S]*?<\/script>\n?/g, '');
    return out;
  }

  /* ---------------- start ---------------- */
  async function startApp() {
    $('#app').hidden = false;
    const base = baseline();
    await A.adoptEmbedded(base); // photos embedded in the website file become library photos
    const [draft, keys, checks, pub, oldBase, opts] = await Promise.all([A.db.get('kv', 'draft'), A.db.keys('media'), A.db.get('kv', 'checks'), A.db.get('kv', 'publishedHash'), A.db.get('kv', 'baseHash'), A.db.get('kv', 'pubopts')]);
    for (const k of keys) { const rec = await A.db.get('media', k); if (rec && rec.blob) A.media.set(k, rec); }

    if (opts && typeof opts === 'object') A.pubOpts = Object.assign(A.pubOpts, opts);
    const baseNorm = A.normalize(LZ.clone(base), LZ.clone(base));
    const baseHash = LZ.hash(baseNorm);

    if (draft && oldBase && oldBase !== baseHash) {
      // The website file is newer (or different) than the one this draft was started from.
      const draftHash = LZ.hash(A.normalize(LZ.clone(draft), LZ.clone(base)));
      if (draftHash !== oldBase && !window.confirm('This website file has different content from the draft saved in this browser, and your draft has changes that were never downloaded.\n\nOK = keep my draft\nCancel = use the content of this website file (draft is discarded)')) useDraft = null;
      else if (draftHash === oldBase) useDraft = null; // draft had no edits of its own
    }
    A.data = A.normalize(useDraft || LZ.clone(base), LZ.clone(base));
    A.publishedHash = (useDraft && pub) || baseHash;
    await A.db.set('kv', 'baseHash', baseHash);
    if (!useDraft) await A.db.set('kv', 'publishedHash', baseHash);
    document.querySelector('.tb-actions a.btn').href = SELF;
    wirePreview();
    $('#undoBtn').addEventListener('click', () => A.undo());
    $('#publishBtn').addEventListener('click', () => A.go('publish'));
    const start = window.LZ_START || '';
    A.go(A.sections[start] ? start : 'dashboard');

  }
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && A.data) { e.preventDefault(); A.toast('Your changes are saved automatically. Use Publish to go live.'); }
  });
  window.addEventListener('beforeunload', () => { if (A.data) A.flush(); });

  (async function init() {
    try {
      await startApp();
    } catch (e) {
      console.error(e);
      const g = document.getElementById('gate');
      g.hidden = false;
      g.innerHTML = '<div class="gate-card"><h1>The admin could not start</h1><p class="lead">' + String((e && e.message) || e).replace(/</g, '&lt;') + '</p><p class="note">Try opening the website file directly in Chrome, Edge, Firefox or Safari (not inside a preview window).</p></div>';
    }
  })();
})();

<script id="js-mount">
/* Admin loader. Does nothing until the Admin button is pressed (or the address ends in #admin).
   It keeps a pristine copy of this page's source (needed to build the downloadable website file)
   and then replaces the page with the admin panel, which runs in an isolated frame so its styles
   and scripts never mix with the public site. No page reload is needed. */
(function () {
  var embed = new URLSearchParams(location.search).get('embed') === '1';
  var hasAdmin = !!document.getElementById('lz-admin-body');
  var isAdminHash = function () { return /^#admin(\/[a-z]+)?$/.test(location.hash); };
  if (embed || !hasAdmin) return;

  // must happen now, before the site script fills the page in
  var SRC = '<!DOCTYPE html>' + document.documentElement.outerHTML;
  var mounted = false;

  function open(start) {
    if (mounted) return;
    mounted = true;
    window.__LZ_ADMIN = true; // tells the site script to stay idle
    var self = location.href.split('#')[0].split('?')[0];
    var T = function (id) { return document.getElementById(id).textContent; };
    var S = function (t) { return '<scr' + 'ipt>' + t + '</scr' + 'ipt>'; };
    var doc = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">' +
      '<title>Lunara Admin</title><style>' + T('lz-admin-css') + '</style></head><body>' + T('lz-admin-body') +
      S('window.LZ_SELF=' + JSON.stringify(self) + ';window.LZ_START=' + JSON.stringify(start || '') + ';') +
      S(T('js-data')) + S(T('js-shared')) + S(T('lz-admin-core')) + S(T('lz-admin-sections')) + S(T('lz-admin-app')) +
      '</body></html>';

    document.title = 'Lunara Admin';
    var st = document.createElement('style');
    st.textContent = 'html,body{margin:0!important;padding:0!important;height:100%!important;overflow:hidden!important;background:#F4F1EB!important}' +
      '#lz-adm{position:fixed;left:0;top:0;width:100%;height:100%;border:0;background:#F4F1EB}';
    document.head.appendChild(st);
    while (document.body.firstChild) document.body.removeChild(document.body.firstChild);
    var f = document.createElement('iframe');
    f.id = 'lz-adm';
    f.title = 'Lunara admin panel';
    f.srcdoc = doc;
    document.body.appendChild(f);
    window.scrollTo(0, 0);
    try { history.replaceState(null, '', '#admin' + (start ? '/' + start : '')); } catch (e) { /* some previews block this */ }

    window.addEventListener('message', function (ev) {
      var m = ev.data;
      if (ev.source !== f.contentWindow || !m || typeof m !== 'object') return;
      if (m.type === 'lz-get-src') f.contentWindow.postMessage({ type: 'lz-src', src: SRC }, '*');
      else if (m.type === 'lz-hash' && /^#admin(\/[a-z]+)?$/.test(m.hash)) { try { history.replaceState(null, '', m.hash); } catch (e) { /* ignore */ } }
    });
  }

  window.__lzOpenAdmin = function () { open(''); };
  window.addEventListener('hashchange', function () { if (isAdminHash()) open((/^#admin\/([a-z]+)$/.exec(location.hash) || [])[1] || ''); });
  if (isAdminHash()) open((/^#admin\/([a-z]+)$/.exec(location.hash) || [])[1] || '');
})();
</script>
